<!-- Sección «Carga y pruebas» del panel (scripts/panel.mjs la inserta antes de </body>). JS sin dependencias; los datos
     llegan por el proxy /api/b/* del panel al backend con la sesión de administrador (PANEL_ADMIN, por defecto «dev jefa»). -->
<style>
#carga{max-width:1200px}
#carga .barra{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
#carga select,#carga input[type=text]{background:#0d0b08;color:var(--txt);border:1px solid var(--borde);border-radius:6px;padding:5px 8px;font:inherit}
#carga input[type=text]{width:150px}
#carga .chip{font-size:12px;padding:3px 10px;border-radius:12px;border:1px solid var(--borde);color:var(--sub)}
#carga .chip.on{color:var(--on);border-color:var(--on)}
#carga .graficas{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(360px,1fr))}
#carga .graf{background:var(--card);border:1px solid var(--borde);border-radius:8px;padding:10px}
#carga .graf h3{font-size:12px;margin:0 0 4px;color:var(--sub);font-weight:600}
#carga svg{width:100%;height:120px;display:block}
#carga .leyenda{font-size:11px;color:var(--sub);display:flex;gap:10px;flex-wrap:wrap;margin-top:2px}
#carga .leyenda i{display:inline-block;width:10px;height:3px;margin-right:4px;vertical-align:middle}
#carga table{border-collapse:collapse;width:100%;font-size:12px;margin-top:8px}
#carga th,#carga td{text-align:left;padding:3px 8px;border-bottom:1px solid var(--borde)}
#carga th{color:var(--sub);font-weight:600}
#carga td.num{white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
#carga tr.rech td{color:var(--off)}
#carga tr.lento td.ms{color:var(--wait);font-weight:600}
#carga .msg{color:var(--sub);font-size:12px}
#carga a.boton{background:#2b241b;color:var(--txt);border:1px solid var(--borde);border-radius:6px;padding:6px 14px;text-decoration:none;font-size:14px}
</style>
<h2>Carga y pruebas</h2>
<div id="carga">
  <div class="barra">
    <label style="margin:0">partida <select id="c-partida"></select></label>
    <label style="margin:0">ventana <select id="c-ventana">
      <option value="5">últimos 5 min</option><option value="15" selected>últimos 15 min</option><option value="60">última hora</option><option value="0">toda la prueba vigente</option><option value="-1">todo</option>
    </select></label>
    <span class="chip" id="c-estado">…</span>
  </div>
  <div class="barra">
    <input type="text" id="c-id" placeholder="id de la prueba" maxlength="64">
    <button id="c-iniciar">Iniciar / etiquetar prueba</button>
    <button id="c-terminar">Terminar (apaga la telemetría)</button>
    <a class="boton" id="c-informe" href="#" download>Descargar informe</a>
    <span class="msg" id="c-msg"></span>
  </div>
  <div class="graficas" id="c-graficas"></div>
  <h2 style="margin-top:22px">Comandos recientes (auditoría)</h2>
  <div class="barra">
    <label style="margin:0"><input type="checkbox" id="a-rech" style="width:auto"> solo rechazos</label>
    <label style="margin:0">ms mínimo <input type="text" id="a-ms" value="0" style="width:60px"></label>
    <span class="msg" id="a-resumen"></span>
  </div>
  <table><thead><tr><th>Momento</th><th>Actor</th><th>Comando</th><th>Resultado</th><th>Causa / detalle</th><th class="num">ms</th><th class="num">bytes</th></tr></thead><tbody id="a-filas"></tbody></table>
</div>
<script>
(function(){
const $=(id)=>document.getElementById(id);
const COLORES=['#c98a3b','#6fa8c9','#5fbf6a','#c4553f','#b48ad6','#d9a63c'];
let partida=null;
const api=(ruta,init)=>fetch('/api/b/'+ruta,init).then(async(r)=>{if(!r.ok)throw new Error(ruta+' '+r.status+' '+(await r.text()).slice(0,120));return r.json()});
const num=(x,d=1)=>(x==null?'—':Number(x).toFixed(d));
const kib=(b)=>(b/1024).toFixed(1)+' KiB';

// Gráfica de líneas en SVG. series: [{n:nombre, p:[[t,y],...]}]
function grafica(titulo,series,unidad){
  const todos=series.flatMap(s=>s.p);
  let h='<div class="graf"><h3>'+titulo+'</h3>';
  if(todos.length<2){return h+'<div class="msg" style="height:120px">sin datos aún</div></div>'}
  const t0=Math.min(...todos.map(p=>p[0])),t1=Math.max(...todos.map(p=>p[0])),ym=Math.max(1e-9,...todos.map(p=>p[1]))*1.1;
  const X=(t)=>34+(t1===t0?0:(t-t0)/(t1-t0))*360,Y=(y)=>108-(y/ym)*98;
  h+='<svg viewBox="0 0 400 120" preserveAspectRatio="none"><g stroke="#3a2f22" stroke-width=".5"><line x1="34" y1="10" x2="394" y2="10"/><line x1="34" y1="59" x2="394" y2="59"/><line x1="34" y1="108" x2="394" y2="108"/></g>';
  h+='<g fill="#9c8b72" font-size="8"><text x="0" y="13">'+(ym>=100?Math.round(ym):ym.toFixed(1))+'</text><text x="0" y="111">0</text><text x="34" y="119">'+new Date(t0).toLocaleTimeString()+'</text><text x="394" y="119" text-anchor="end">'+new Date(t1).toLocaleTimeString()+'</text></g>';
  series.forEach((s,i)=>{h+='<polyline fill="none" stroke="'+COLORES[i%COLORES.length]+'" stroke-width="1.5" vector-effect="non-scaling-stroke" points="'+s.p.map(p=>X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1)).join(' ')+'"/>'});
  h+='</svg><div class="leyenda">'+series.map((s,i)=>'<span><i style="background:'+COLORES[i%COLORES.length]+'"></i>'+s.n+'</span>').join('')+'<span>'+unidad+'</span></div></div>';
  return h;
}
const T=(m)=>Date.parse(m.momento);
const maxCanales=(m,f)=>Math.max(0,...Object.values(m.canales).map(f));
const sumaCanales=(m,f)=>Object.values(m.canales).reduce((a,c)=>a+f(c),0);

function pintarGraficas(ms){
  const ven=ms.filter(m=>m.ventanaMs>0);
  const tipos=[...new Set(ms.flatMap(m=>Object.keys(m.canales)))].sort();
  const g=[];
  g.push(grafica('Proyección / diff / serialización (ms, p95 de ventana, peor canal)',[
    {n:'proyección',p:ms.map(m=>[T(m),maxCanales(m,c=>c.msProyeccion.p95)])},
    {n:'diff',p:ms.map(m=>[T(m),maxCanales(m,c=>c.msDiff.p95)])},
    {n:'serialización',p:ms.map(m=>[T(m),maxCanales(m,c=>c.msSerializacion.p95)])}],'ms'));
  g.push(grafica('Bytes empujados por segundo, por canal',tipos.map(t=>({n:t,p:ven.map(m=>[T(m),((m.canales[t]?.bytesEnviados||0)/(m.ventanaMs/1000))/1024])})),'KiB/s'));
  g.push(grafica('Bytes por flush (p95) por canal',tipos.map(t=>({n:t,p:ms.map(m=>[T(m),(m.canales[t]?.bytesFlush.p95||0)/1024])})),'KiB'));
  g.push(grafica('Suscriptores y claves de visibilidad',[
    {n:'suscriptores',p:ms.map(m=>[T(m),m.suscriptores])},{n:'claves',p:ms.map(m=>[T(m),m.claves])},{n:'conexiones',p:ms.map(m=>[T(m),m.conexiones])}],'nº'));
  g.push(grafica('Tick del motor',[
    {n:'p95',p:ms.map(m=>[T(m),m.tickMs.p95])},{n:'máx',p:ms.map(m=>[T(m),m.tickMs.max])},{n:'guardado snapshot máx',p:ms.map(m=>[T(m),m.guardadoMs.max])}],'ms'));
  g.push(grafica('Retraso del bucle de eventos',[
    {n:'p99',p:ms.map(m=>[T(m),m.bucleMs.p99])},{n:'máx',p:ms.map(m=>[T(m),m.bucleMs.max])}],'ms'));
  g.push(grafica('Memoria',[
    {n:'rss',p:ms.map(m=>[T(m),m.memoriaMb.rss])},{n:'heap usado',p:ms.map(m=>[T(m),m.memoriaMb.heapUsado])}],'MB'));
  g.push(grafica('Fotos de recuperación y sockets lentos',[
    {n:'resync+lento+visibilidad',p:ms.map(m=>[T(m),sumaCanales(m,c=>c.fotos.resync+c.fotos.lento+c.fotos.visibilidad)])},
    {n:'sockets lentos/4408',p:ms.map(m=>[T(m),sumaCanales(m,c=>c.socketsLentos+c.cierres4408)])}],'por ventana'));
  g.push(grafica('Coste de la propia telemetría',[{n:'ms por muestra',p:ms.map(m=>[T(m),m.costeMuestraMs])}],'ms'));
  $('c-graficas').innerHTML=g.join('');
}

function pintarAuditoria(entradas){
  const lentos=entradas.map(e=>e.ms||0).sort((a,b)=>a-b),p95=lentos[Math.floor((lentos.length-1)*.95)]||0;
  $('a-resumen').textContent=entradas.length+' comandos · ms p95 '+num(p95)+' · rechazos '+entradas.filter(e=>e.resultado==='rechazado').length;
  $('a-filas').innerHTML=entradas.slice(-60).reverse().map(e=>{
    const c=document.createElement('tr');c.className=(e.resultado==='rechazado'?'rech ':'')+((e.ms||0)>p95&&p95>0?'lento':'');
    const f=(t,cl)=>{const d=document.createElement('td');d.textContent=t;if(cl)d.className=cl;c.append(d)};
    f(new Date(e.momento).toLocaleTimeString());f(e.actor);f(e.comando);f(e.resultado);f(e.causa?(e.causa+(e.detalle?': '+e.detalle:'')):'');f(e.ms==null?'—':num(e.ms,2),'num ms');f(e.bytes==null?'—':kib(e.bytes),'num');
    return c.outerHTML}).join('');
}

async function refrescar(){
  try{
    // Solo las partidas ABIERTAS en el proceso: la carga y el playtest de una que solo está en disco dan 404.
    const ids=((await api('metricas')).partidas||[]).map(p=>p.gameId);const sel=$('c-partida');
    if(sel.options.length!==ids.length||[...sel.options].some((o,i)=>o.value!==ids[i])){const previa=sel.value;sel.innerHTML=ids.map(i=>'<option>'+i+'</option>').join('');if(ids.includes(previa))sel.value=previa}
    partida=sel.value||null;
    if(!partida){$('c-estado').className='chip';$('c-estado').textContent='ninguna partida abierta en el servidor';$('c-graficas').innerHTML='';return}
    const v=Number($('c-ventana').value);
    const consulta=new URLSearchParams();
    if(v>0)consulta.set('desde',new Date(Date.now()-v*60000).toISOString());
    let r=await api('partidas/'+partida+'/carga?'+consulta);
    if(v===0&&r.playtestVigente){r=await api('partidas/'+partida+'/carga?playtestId='+encodeURIComponent(r.playtestVigente))}
    const chip=$('c-estado');chip.className='chip'+(r.telemetriaActiva?' on':'');
    chip.textContent=(r.telemetriaActiva?'telemetría ENCENDIDA':'telemetría apagada')+(r.playtestVigente?' · prueba «'+r.playtestVigente+'»':'')+' · '+r.muestras.length+' muestras';
    if(document.activeElement!==$('c-id'))$('c-id').placeholder=r.playtestVigente||'id de la prueba';
    pintarGraficas(r.muestras);
    const a=new URLSearchParams();if(v>0)a.set('desde',consulta.get('desde'));
    else if(r.muestras[0])a.set('desde',r.muestras[0].momento);
    if($('a-rech').checked)a.set('soloRechazos','true');
    const mm=Number($('a-ms').value);if(mm>0)a.set('msMinimo',String(mm));
    pintarAuditoria((await api('partidas/'+partida+'/auditoria?'+a)).entradas);
    $('c-informe').href='/api/informe/'+encodeURIComponent(partida)+(r.playtestVigente?'?playtest='+encodeURIComponent(r.playtestVigente):'');
    $('c-informe').download='informe-carga-'+partida+(r.playtestVigente?'-'+r.playtestVigente:'')+'.md';
  }catch(e){$('c-estado').className='chip';$('c-estado').textContent='backend no disponible';$('c-msg').textContent=String(e.message||e)}
}
async function fijar(id){
  $('c-msg').textContent='';
  try{await api('partidas/'+$('c-partida').value+'/playtest',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({id})});refrescar()}
  catch(e){$('c-msg').textContent=String(e.message||e)}
}
$('c-iniciar').onclick=()=>{const id=$('c-id').value.trim()||('prueba-'+new Date().toISOString().slice(0,16).replace(/[:T]/g,'-'));$('c-id').value='';fijar(id)};
$('c-terminar').onclick=()=>fijar(null);
['c-partida','c-ventana','a-rech','a-ms'].forEach(i=>$(i).onchange=refrescar);
refrescar();setInterval(refrescar,3000);
})();
</script>
