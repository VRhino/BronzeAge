[package]
name = "lanzador"
version = "0.2.0"
edition = "2021"
description = "El lanzador de servidores de batalla: abre la sesión CLIENTE_SERVIDOR_BATALLA con el motor, reclama las batallas y arranca un proceso de batalla por cada una (Batalla_Unity_Ciclo §8.8)"

[[bin]]
name = "bronzeage-lanzador"
path = "src/main.rs"

# El servidor de batalla de mentira (sin Unity): lo arranca el lanzador en las pruebas y sirve de ejemplo del protocolo para Conquest.
[[bin]]
name = "bronzeage-batalla-de-mentira"
path = "src/bin/batalla_de_mentira.rs"

[dependencies]
contrato = { path = "../contrato" }
futures-util = "0.3.34"
getrandom = "0.2"
prost = "0.13"
serde_json = "1"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "io-std", "process", "signal"] }
tokio-tungstenite = "0.30.0"

[dev-dependencies]
acceso = { path = "../acceso" }
base = { path = "../base" }
militar = { path = "../militar" }
nucleo = { path = "../nucleo" }
rutas = { path = "../rutas" }
servidor = { path = "../servidor" }
combate = { path = "../combate" }
