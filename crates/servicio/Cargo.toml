[package]
name = "servicio"
version = "0.1.0"
edition = "2021"
description = "El proceso del servidor (fase 7, 7B): el artefacto de mundo, el núcleo persistente, el WebSocket del contrato 05 y el servicio de acceso en un solo puerto"

[[bin]]
name = "bronzeage-servidor"
path = "src/main.rs"

[dependencies]
acceso = { path = "../acceso" }
mundo = { path = "../mundo" }
nucleo = { path = "../nucleo" }
persistencia = { path = "../persistencia" }
rutas = { path = "../rutas" }
servidor = { path = "../servidor" }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync", "net", "signal", "io-std", "io-util"] }

[dev-dependencies]
contrato = { path = "../contrato" }
serde_json = "1"
tempfile = "3"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
