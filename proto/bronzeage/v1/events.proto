// Contrato 05 de BronzeAge — eventos de dominio.
//
// Un evento es un HECHO que ya ocurrió (narración, avisos, crónica), no el cambio de estado: el estado viaja como
// entidades (entities.proto) en la misma `Delta`. Un cliente no necesita interpretar eventos para estar al día.
// El catálogo de códigos (familia.nombre: comercio.*, diplomacia.*, construccion.*, ejercito.*, columna.*, aedas.*, jugador.*,
// asentamiento.*, mercenarios.*, combate.*, faccion.*, heroe.*, fundacion.*, bandidos.*, tecnologia.*...) es el bloque
// `<!-- eventos -->` de cada documento de Docs/Mechanics, y la forma del payload de cada uno, sus tablas de eventos
// (Docs/Coordinacion/05_Contrato_de_Sesion.md §8).
//
// FORMA (decisión del autor, 2026-10-22): TODOS los eventos llevan el `payload` genérico (`google.protobuf.Struct` con los campos
// documentados para cada código: texto, número o lista). Además, los que mueven la interfaz (los quince de 4H T5, los ocho de la política de 5H y los diez de la tecnología y los Aedas de 6G) llevan un mensaje TIPADO en
// `tipado` (el cliente actúa con él sin interpretar el Struct). El tipado y el payload dicen lo mismo: quien no quiera el
// tipado (la crónica, un cliente simple) usa el payload.
syntax = "proto3";

package bronzeage.v1;

import "google/protobuf/struct.proto";
import "bronzeage/v1/battle.proto";
import "bronzeage/v1/common.proto";
import "bronzeage/v1/entities.proto";

option csharp_namespace = "BronzeAge.Contract.V1";

message EventoDominio {
  string codigo = 1;
  uint64 version = 2;                    // versión de mundo que lo produjo
  int64 en_ms = 3;                       // instante de mundo en que ocurrió
  optional string asentamiento_id = 4;   // a quién se atribuye (decide quién lo oye)
  repeated string heroes_ids = 5;        // héroes nombrados: lo oyen aunque no vean la plaza
  google.protobuf.Struct payload = 6;
  repeated string facciones_ids = 7;     // Facciones que lo oyen enteras (la dueña de la plaza, los dos bandos de un combate...)
  // El mensaje tipado de los eventos que mueven la interfaz (ausente en el resto). Código → mensaje:
  oneof tipado {
    BatallaAbierta batalla_abierta = 10;             // batalla.abierta, evento_pve.abierta
    BatallaAsignada batalla_asignada = 11;           // batalla.asignada, evento_pve.asignada
    BatallaCerrada batalla_cerrada = 12;             // batalla.aplicada | cancelada | fallida (y evento_pve.*)
    PlazaConquistada plaza_conquistada = 13;         // asentamiento.conquistada
    PlazaEnRuinas plaza_en_ruinas = 14;              // asentamiento.ruinas
    AsedioResistido asedio_resistido = 15;           // combate.asedio_resistido
    UnionPedida union_pedida = 16;                   // columna.union_pedida, convocatoria.union_pedida
    ConvocatoriaConvocada convocatoria_convocada = 17;  // convocatoria.convocada
    ConvocatoriaPartio convocatoria_partio = 18;     // convocatoria.partio
    HeroeExpulsado heroe_expulsado = 19;             // heroe.expulsado, heroe.desalojado
    ColumnaConHambre columna_con_hambre = 20;        // ejercito.viveres_bajos, ejercito.sin_viveres
    DesercionPorHambre desercion_por_hambre = 21;    // tropas.desercion
    GuerraDeclarada guerra_declarada = 22;           // faccion.guerra_declarada
    ObraTerminada obra_terminada = 23;               // construccion.edificio_completado | mejora_completada | recinto_completado, pueblo.completado, avanzada.completada
    HeroeHerido heroe_herido = 24;                   // heroe.herido
    // La política (5H):
    PropuestaDiplomatica propuesta_diplomatica = 25; // diplomacia.relacion_propuesta | anexion_propuesta | fusion_propuesta
    PropuestaResuelta propuesta_resuelta = 26;       // diplomacia.relacion_aceptada | relacion_rechazada | relacion_retirada | anexion_rechazada | anexion_retirada | fusion_rechazada | fusion_retirada
    RelacionTerminada relacion_terminada = 27;       // diplomacia.relacion_rota | paz_firmada | rebelion_vasallo | vasallo_liberado
    FaccionesUnidas facciones_unidas = 28;           // diplomacia.anexion | diplomacia.fusion
    CargoAsignado cargo_asignado = 29;               // cargo.local_asignado | cargo.rey_asignado | cargo.embajador_asignado
    TituloCambiado titulo_cambiado = 30;             // titulo.nace | titulo.cambia_manos
    SolicitudDeIngreso solicitud_de_ingreso = 31;    // faccion.solicitud_ingreso
    CiudadaniaCambiada ciudadania_cambiada = 32;     // faccion.creada | ciudadania_union | solicitud_denegada | abandonada
    // La tecnología y los Aedas (6G):
    LogroCumplido logro_cumplido = 33;               // tecnologia.logro (público; `en_ms` es el del hecho)
    EraComenzada era_comenzada = 34;                 // era.comienza (público)
    TecnologiaAparecida tecnologia_aparecida = 35;   // tecnologia.aparece
    TecnologiaAdoptada tecnologia_adoptada = 36;     // tecnologia.adoptada
    DescubrimientoCantado descubrimiento_cantado = 37;  // aedas.canta_descubrimiento (público)
    RevelacionDeAeda revelacion_de_aeda = 38;        // aedas.revela
    CompraAAeda compra_a_aeda = 39;                  // aedas.venta
    ResidenteCambia residente_cambia = 40;           // aedas.residente_llega | residente_se_va
    EpicaCambia epica_cambia = 41;                   // aedas.epica_empieza | epica_capitulo | epica_tecnologia | epica_cumplida | epica_abandonada
    AlijoAbierto alijo_abierto = 42;                 // alijo.abierto
  }
}

// Una batalla de Unity se abrió. Con `contexto` de asedio y `convocatoria_hasta_ms` el cliente ofrece unirse (mira `Batalla.lado_para_unirse`).
message BatallaAbierta {
  string battle_id = 1;
  ContextoEstrategico contexto = 2;
  Punto punto = 3;
  optional string iniciada_por = 4;      // ausente si no la inició nadie (los bandidos)
  optional string atacante_faccion_id = 5;
  optional string defensor_faccion_id = 6;
  optional int64 convocatoria_hasta_ms = 7;
}

// La batalla tiene servidor: sus combatientes ya pueden pedir su token (`Batalla.asignacion_propia`) y conectar con Unity.
message BatallaAsignada {
  string battle_id = 1;
}

message BatallaCerrada {
  string battle_id = 1;
  EstadoBatalla estado = 2;              // BATALLA_APLICADA | BATALLA_CANCELADA | BATALLA_FALLIDA
  optional LadoId ganador = 3;           // solo si se aplicó un resultado
  optional RazonVictoria razon = 4;
}

message PlazaConquistada {
  string asentamiento_id = 1;
  optional string atacante_faccion_id = 2;
  optional string defensor_faccion_id = 3;   // la dueña anterior
}

// La plaza perdió lo que necesita para vivir y quedó en ruinas.
message PlazaEnRuinas {
  string asentamiento_id = 1;
  repeated string recursos_faltantes = 2;
}

message AsedioResistido {
  string asentamiento_id = 1;
  optional string atacante_faccion_id = 2;
}

// Alguien pide unirse a un ejército o a una convocatoria: el Líder responde con `responder_peticion_de_union` o `responder_peticion_de_convocatoria`.
message UnionPedida {
  string destino_id = 1;                 // `ej-N` o `conv-N`
  bool destino_es_convocatoria = 2;
  string solicitante_id = 3;
  int64 expira_en_ms = 4;
}

message ConvocatoriaConvocada {
  string convocatoria_id = 1;
  string lugar_id = 2;                   // `as-N` o `camp-N`
  bool lugar_es_campamento = 3;
  string lider_id = 4;
}

// El Líder partió: los integrantes salieron como un ejército.
message ConvocatoriaPartio {
  string convocatoria_id = 1;
  string ejercito_id = 2;
}

// Un héroe dejó de estar donde estaba sin querer: cerraron la puerta, cayó el lugar o se le echó.
message HeroeExpulsado {
  string heroe_id = 1;
  string lugar_id = 2;                   // `as-N`, `pueblo-N`, `av-N` o `camp-N`
  string motivo = 3;                     // puerta_cerrada | conquista | ruina | desalojo
  optional string ejercito_id = 4;       // la columna con la que salió al mapa, si salió
}

message ColumnaConHambre {
  string ejercito_id = 1;
  bool sin_viveres = 2;                  // false: quedan pocos (aviso); true: se acabaron (empiezan las deserciones)
}

message DesercionPorHambre {
  string heroe_id = 1;
  string escuadra_id = 2;
  uint32 desertores = 3;
}

message GuerraDeclarada {
  string atacante_faccion_id = 1;
  string contra_faccion_id = 2;
  repeated string arrastradas_ids = 3;   // Facciones que entran por arrastre (vacío hasta el sistema político)
}

message ObraTerminada {
  string asentamiento_id = 1;            // la plaza a la que pertenece (la madre, para un pueblo o una avanzada)
  string clase = 2;                      // edificio | mejora | recinto | pueblo | avanzada
  string objeto_id = 3;                  // `ed-<plaza>-<n>`, `recinto-<plaza>-<n>`, `pueblo-N` o `av-N`
  optional uint32 nivel = 4;             // el nivel alcanzado, si la clase lo tiene
}

message HeroeHerido {
  string heroe_id = 1;
  int64 hasta_ms = 2;
}

// ───────────────────────────── La política (5H) ─────────────────────────────

// Una propuesta nueva entre dos Facciones: la contesta el Rey de `faccion_b_id` (`responder_relacion`, `responder_anexion`, `responder_fusion`); la entidad es `Propuesta` en `FACCION`.
message PropuestaDiplomatica {
  string propuesta_id = 1;               // `prop-N`
  string clase = 2;                      // relacion | anexion | fusion
  string faccion_a_id = 3;               // quien propone (en un vasallaje, la señora; en la anexión, la absorbente)
  string faccion_b_id = 4;               // quien contesta
  string propuesta_por = 5;              // el héroe que la hizo
  optional TipoRelacion tipo = 6;        // en una de relación: alianza o vasallaje
  optional string nombre = 7;            // en una fusión: el nombre de la Facción nueva
}

// Una propuesta que se acepta, se rechaza o se retira (la anexión y la fusión aceptadas son `FaccionesUnidas`). La entidad sale de `FACCION` con `QUITA`.
message PropuestaResuelta {
  optional string propuesta_id = 1;      // ausente en una relación que fija la administración, sin propuesta
  string clase = 2;                      // relacion | anexion | fusion
  string resultado = 3;                  // aceptada | rechazada | retirada
  string faccion_a_id = 4;
  string faccion_b_id = 5;
  optional string relacion_id = 6;       // la relación que nace al aceptarla
}

// Una relación que acaba (rota, la paz, la rebelión de la vasalla o su liberación). La entidad sale de `FACCION` y `VISTA` con `QUITA`.
message RelacionTerminada {
  string relacion_id = 1;
  string faccion_a_id = 2;               // en un vasallaje, la señora
  string faccion_b_id = 3;
  string como = 4;                       // rota | paz | rebelion | liberacion
  optional string por_faccion_id = 5;    // quien la rompió o firmó la paz
}

// Dos Facciones que pasan a ser una: la anexión (la absorbente se queda con todo) o la fusión (nace otra).
message FaccionesUnidas {
  string clase = 1;                      // anexion | fusion
  string faccion_a_id = 2;
  string faccion_b_id = 3;
  string resultante_id = 4;              // la absorbente, o la Facción nueva de la fusión
  optional string nombre = 5;            // el de la Facción nueva
}

// Un cargo que cambia de titular: los locales de una plaza (también el Gobernador de oficio al fundar, 5E-3) y el Rey y el Embajador de la Facción.
message CargoAsignado {
  string heroe_id = 1;
  string cargo = 2;                      // gobernador | tesorero | general | maestroObras | sacerdote | rey | embajador
  string faccion_id = 3;
  optional string asentamiento_id = 4;   // solo los locales
}

// Un título de prestigio que nace o cambia de manos (público).
message TituloCambiado {
  string titulo_id = 1;                  // su clave (`faccionMasGrande`, `granRey`...)
  string faccion_id = 2;                 // quien lo tiene ahora
  optional string faccion_anterior_id = 3;
}

// Un héroe pide entrar en la Facción: lo contesta su Rey (`responder_solicitud`).
message SolicitudDeIngreso {
  string heroe_id = 1;
  string faccion_id = 2;
}

// La ciudadanía de un héroe cambia: crea una Facción (y es su Rey), le aceptan, le deniegan o la deja.
message CiudadaniaCambiada {
  string heroe_id = 1;
  string faccion_id = 2;
  string como = 3;                       // creada | ingreso | denegada | abandono
}

// ───────────────────────────── La tecnología y los Aedas (6G) ─────────────────────────────

// Empieza una Era nueva (público): por cumplir todos los logros de la anterior o porque se agotó su plazo.
message EraComenzada {
  string era_id = 1;                     // `I`, `II`, `III`...
  uint32 orden = 2;
  bool por_plazo = 3;
}

// A la Facción le aparece una tecnología por su hito: ya la puede adoptar el Rey en la capital (`adoptar_tecnologia`).
message TecnologiaAparecida {
  string faccion_id = 1;
  string tecnologia_id = 2;
  bool primera = 3;                      // la primera del mundo: la Facción es su descubridora
}

message TecnologiaAdoptada {
  string faccion_id = 1;
  string capital_id = 2;                 // la plaza que pagó la tarifa
  string tecnologia_id = 3;
}

// Los Aedas cantan un descubrimiento (público): quién lo hizo y qué. Desde entonces los itinerantes pueden revelarlo y venderlo.
message DescubrimientoCantado {
  string descubridora_faccion_id = 1;
  string tecnologia_id = 2;
}

// Un Aeda itinerante parado en la plaza le revela a su Facción una tecnología que no tiene: `faltan`, los índices de las condiciones de su hito que aún no cumple.
message RevelacionDeAeda {
  string faccion_id = 1;
  string asentamiento_id = 2;
  string descubridora_faccion_id = 3;
  string tecnologia_id = 4;
  repeated uint32 faltan = 5;
}

// La plaza le compró una tecnología a un Aeda itinerante: le aparece a su Facción sin su hito.
message CompraAAeda {
  string faccion_id = 1;
  string asentamiento_id = 2;
  string aeda_id = 3;                    // `aeda-N`
  string tecnologia_id = 4;
  sint64 precio = 5;                     // el oro pagado, en milésimas
}

// Un Aeda residente llega a la plaza o se va (porque bajó su cupo).
message ResidenteCambia {
  string aeda_id = 1;                    // `aeda-rN`
  string faccion_id = 2;
  string asentamiento_id = 3;
  bool llega = 4;                        // false: se va
  optional uint32 cupo = 5;              // al irse, el cupo que quedó
}

// La épica de un Aeda residente: empieza, cierra un capítulo, hace aparecer su tecnología (privado), se cumple (público, sin la tecnología ni la plaza) o se abandona.
message EpicaCambia {
  string aeda_id = 1;                    // `aeda-rN`
  string faccion_id = 2;
  optional string asentamiento_id = 3;
  optional string tecnologia_id = 4;     // ausente en la cumplida (pública)
  string como = 5;                       // empieza | capitulo | tecnologia | cumplida | abandonada
  uint32 capitulo = 6;                   // el que empieza ahora (al acabar, = `capitulos`)
  uint32 capitulos = 7;
  optional string motivo = 8;            // al abandonarse: orden | conquista | aparecida | unificada
}

// El héroe abrió un alijo: su oro (en milésimas, ya en unidades enteras) y lo que cupo en el carro; lo demás se perdió.
message AlijoAbierto {
  string heroe_id = 1;
  string alijo_id = 2;
  sint64 oro = 3;
  sint64 cargado = 4;
}
