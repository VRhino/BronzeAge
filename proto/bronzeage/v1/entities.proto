// Contrato 05 de BronzeAge — modelo de datos COMPLETO: todas las entidades del dominio que cruzan el borde.
//
// Sale del canon (Docs/Game) y de Docs/Mechanics, no del código TypeScript: lo que ese código guardaba por culpa del tick
// (progreso por tick, `ruta`/`progreso`, `extractoresTicksSinCupo`, `origenAsentamientoId`, estado `regresando`, caravanas
// «militar» y «contrabando») NO existe aquí. Movimiento = `Plan`; economía y crecimiento = `Ritmo`.
//
// Cada entidad con identidad lleva `version` (la versión de mundo en que cambió por última vez): es lo que permite la
// reanudación por versión (session.proto). FORMA DE UN CAMBIO (decisión del autor, 2026-10-22; ver `Cambio` en session.proto):
// casi todas las entidades viajan COMPLETAS y sustituyen a la anterior; solo las dos grandes, el `Asentamiento` (la plaza y su
// ciudad), se pueden actualizar de forma PARCIAL, con la máscara `Cambio.campos`.
syntax = "proto3";

package bronzeage.v1;

import "bronzeage/v1/common.proto";

option csharp_namespace = "BronzeAge.Contract.V1";

// ───────────────────────────── Facción y política ─────────────────────────────

// La Facción. En `FACCION` (la propia) y en `ADMIN`, entera. En `VISTA`, la de cada OTRA Facción que nombra lo que se ve (sus columnas, caravanas, plazas, pueblos, avanzadas,
// fichas y batallas, y las relaciones y los títulos, que son públicos) como **forma pública** (5H; Proyecciones §6, «facciones: públicas en
// la ficción»): `id`, `version`, `nombre`, `sigilo`, `nivel`, `reputacion`, `rey_id`, `embajador_id`, `ciudadanos_ids`, `solicitudes_ids`, `derrotada_por`, `admite_otras_en_ataques`
// y `liga`; sin `experiencia`, `capital_designada_en_ms` ni `capital_id` (dónde está su capital es de la niebla).
message Faccion {
  string id = 1;
  uint64 version = 2;
  string nombre = 3;
  Sigilo sigilo = 4;
  optional string rey_id = 5;
  optional string embajador_id = 6;
  optional int64 capital_designada_en_ms = 7;
  uint32 nivel = 8;
  sint64 experiencia = 9;
  repeated string ciudadanos_ids = 10;
  repeated string solicitudes_ids = 11;
  Ritmo reputacion = 12;                 // -100..100 (milésimas); decae como ritmo
  optional string derrotada_por = 13;    // "" = colapsó sin ganador; ausente = no derrotada
  bool admite_otras_en_ataques = 14;
  optional string capital_id = 15;       // capital efectiva: la designada con Palacio activo o, si no, la plaza viva más antigua (ausente sin plazas)
  // La Liga en que está (5H, Diplomacia §5.7): derivada de las relaciones activas; ausente si no está en ninguna.
  optional LigaDeFaccion liga = 16;
  // Sus misiones (Misiones §5): solo en la Facción propia (`FACCION`) y en `ADMIN`; vacío en la forma pública.
  repeated Mision misiones = 17;
}

enum EstadoMision {
  ESTADO_MISION_NO_ESPECIFICADO = 0;
  MISION_ACTIVA = 1;      // se puede cumplir: habilitada y con su previa cumplida
  MISION_CUMPLIDA = 2;    // cumplida y sin reclamar: `reclamar_recompensa`
  MISION_RECLAMADA = 3;
}

// Una condición de una misión: el contador, lo que lleva y lo que pide. En una cumplida, `avance` es el umbral.
message CondicionMision {
  string contador = 1;
  uint64 avance = 2;
  uint64 umbral = 3;
}

// Una misión de su dueño (el héroe, la plaza o la Facción; Misiones §5). Solo viajan las activas, las cumplidas y las reclamadas: las que esperan
// a su previa y las deshabilitadas, no.
message Mision {
  string id = 1;                          // el del catálogo: H1, A4, F3...
  EstadoMision estado = 2;
  repeated CondicionMision condiciones = 3;
  optional string previa = 4;
  Cantidades recompensa = 5;              // oro (al almacén personal, en las del héroe) o recursos (al almacén de la plaza), en milésimas
  sint64 recompensa_experiencia = 6;      // experiencia de Facción
}

// Una Liga (Diplomacia §5.7): la componente conexa de Facciones unidas por relaciones activas de cualquier clase (la guerra incluida). No tiene id propio: viaja en cada Facción miembro.
message LigaDeFaccion {
  repeated string miembros_ids = 1;      // por id, la propia incluida
  bool tiene_vasallaje = 2;
  optional string gran_rey_id = 3;       // la señora de un vasallaje de la Liga que no es vasalla en ella (también es el título «Gran Rey»)
}

enum TipoRelacion {
  TIPO_RELACION_NO_ESPECIFICADO = 0;
  RELACION_VASALLAJE = 1;   // a es la señora, b la vasalla
  RELACION_ALIANZA = 2;
  RELACION_GUERRA = 3;
}

enum EstadoRelacion {
  ESTADO_RELACION_NO_ESPECIFICADO = 0;
  RELACION_ACTIVA = 1;
  RELACION_ROTA = 2;
}

message Tributo {
  string recurso = 1;
  sint64 cantidad_por_minuto = 2;        // milésimas; es un flujo continuo de la vasalla a la capital de la señora
}

message RelacionPolitica {
  string id = 1;
  uint64 version = 2;
  TipoRelacion tipo = 3;
  string faccion_a_id = 4;
  string faccion_b_id = 5;
  optional Tributo tributo = 6;
  int64 creado_en_ms = 7;
  EstadoRelacion estado = 8;
  optional string rota_por = 9;
  optional int64 rota_en_ms = 10;
  optional string paz_propuesta_por = 11;
}

message Propuesta {
  string id = 1;
  uint64 version = 2;
  string propuesta_por = 3;              // el HÉROE que la hizo (`heroe-N`; 5A-7, decidido en 5H: Diplomacia §2.4 y el TypeScript); la Facción que propone es la `a` de su clase
  int64 creada_en_ms = 4;
  int64 expira_en_ms = 5;
  oneof clase {
    PropuestaRelacion relacion = 10;
    PropuestaAnexion anexion = 11;
    PropuestaFusion fusion = 12;
  }
}

message PropuestaRelacion {
  TipoRelacion tipo = 1;                 // alianza o vasallaje
  string faccion_a_id = 2;
  string faccion_b_id = 3;
  optional Tributo tributo = 4;
}

message PropuestaAnexion {
  string absorbente_id = 1;
  string absorbida_id = 2;
}

message PropuestaFusion {
  string faccion_a_id = 1;
  string faccion_b_id = 2;
  string nuevo_nombre = 3;
  string nuevo_rey_id = 4;
}

message Titulo {
  string titulo_id = 1;
  uint64 version = 2;
  string nombre = 3;
  string poseedor_id = 4;
  sint64 valor_metrica = 5;
}

// ───────────────────────────── Asentamiento ─────────────────────────────

enum EstadoEdificio {
  ESTADO_EDIFICIO_NO_ESPECIFICADO = 0;
  EDIFICIO_EN_COLA = 1;
  EDIFICIO_EN_CONSTRUCCION = 2;
  EDIFICIO_ACTIVO = 3;
}

enum AmbitoEdificio {
  AMBITO_EDIFICIO_NO_ESPECIFICADO = 0;
  AMBITO_EDIFICIO_ASENTAMIENTO = 1;
  AMBITO_EDIFICIO_MAPA = 2;
}

message MejoraEnCurso {
  uint32 nivel_objetivo = 1;
  int64 completa_en_ms = 2;
}

message Edificio {
  string id = 1;
  string tipo = 2;                       // id de catálogo
  Punto posicion = 3;                    // en el espacio LOCAL del asentamiento (200 locales por unidad de mapa)
  EstadoEdificio estado = 4;
  optional int64 completa_en_ms = 5;
  AmbitoEdificio ambito = 6;
  optional string fuente_id = 7;         // nodo de recurso o parcela de bosque que explota
  optional uint32 nivel_interno = 8;
  optional MejoraEnCurso mejora = 9;
  bool rotado = 10;
  bool semilla_saturada = 11;
  bool ancla_llena = 12;
  optional uint32 prioridad = 13;
  bool pausado_por_almacen_lleno = 14;
  bool danado = 15;
  // Huella en UNIDADES LOCALES con la rotación ya aplicada (`rotado`): la pieza ocupa `posicion` ± la mitad. Es lo que el cliente dibuja
  // (no ve celdas) junto con `TrazadoUrbano`.
  uint32 ancho = 16;
  uint32 alto = 17;
}

enum ClaseCelda {
  CLASE_CELDA_NO_ESPECIFICADA = 0;
  CELDA_MURO = 1;
  CELDA_PUERTA = 2;
  CELDA_TORRE = 3;
}

message CeldaMuro {
  sint32 col = 1;
  sint32 fila = 2;
  ClaseCelda clase = 3;
}

message Recinto {
  string id = 1;                         // `recinto-<plaza>-<n>`
  uint32 nivel = 2;
  repeated CeldaMuro celdas = 3;
  uint32 avance = 4;                     // celdas levantadas
  optional uint32 mejorando_a = 5;
  optional int64 siguiente_celda_en_ms = 6;
  int64 comprometido_en_ms = 7;
  optional int64 completado_en_ms = 8;
  // Con una mejora en curso (`mejorando_a`), cuántas celdas, en el orden de `celdas`, ya son del nivel nuevo (paridad P7: el `avance` de la mejora del TypeScript).
  optional uint32 mejoradas = 9;
}

message Cargos {
  optional string gobernador_id = 1;
  optional string tesorero_id = 2;
  optional string general_id = 3;
  optional string maestro_obras_id = 4;
  optional string sacerdote_id = 5;
}

message PoliticaActiva {
  string id = 1;
  string politica_id = 2;
  string cargo = 3;                      // gobernador | tesorero | general | maestroObras | sacerdote
  int64 activada_en_ms = 4;
  int64 expira_en_ms = 5;
}

enum GrupoPuerta {
  GRUPO_PUERTA_NO_ESPECIFICADO = 0;
  GRUPO_NEUTRALES = 1;
  GRUPO_ALIADOS = 2;
  GRUPO_ENEMIGOS = 3;
  GRUPO_AEDAS = 4;
}

message AscensoEnCurso {
  uint32 nivel_objetivo = 1;
  int64 iniciado_en_ms = 2;
  int64 completa_en_ms = 3;
}

// La población es ENTERA (economía por minuto, decisión del autor del 2026-10-22): cada clase guarda habitantes enteros, así que
// `valor_en_t0` es siempre múltiplo de 1.000 (milésimas de persona) y no hay nada que redondear. El crecimiento fraccionario que la
// plaza lleva entre persona y persona (el «resto oculto») NO viaja. Cambia en el paso de minuto: `en_escalones = true` y `por_minuto`
// es la tendencia de ese paso. (Sustituye a la regla v1 «continua, se lee entera con suelo».)
message Poblacion {
  Ritmo pesants = 1;
  Ritmo artesanos = 2;
  Ritmo nobleza = 3;
  // La plaza tocó nutrición 0 y no vuelve a crecer hasta recuperar 100 (D8, economía por minuto): la marca de recuperación, que el cliente rotula junto a la nutrición. Es estado de juego (no se deduce de la nutrición).
  bool en_recuperacion = 4;
}

message Asentamiento {
  string id = 1;
  uint64 version = 2;
  optional string nombre = 3;
  string faccion_id = 4;
  repeated string fundadores_ids = 5;     // quienes la fundaron y siguen residiendo en ella (5H, 5B-9): al mudarse dejan de serlo; la conquista la deja sin ninguno. Interior, ficha propia y ADMIN
  Punto posicion = 6;
  uint32 nivel = 7;                      // alcanzado (monótono)
  uint32 nivel_actual = 8;               // operativo (baja con el mantenimiento)
  optional uint32 racha_mantenimiento_sano = 9;
  int64 fundado_en_ms = 10;
  sint64 radio_potencial = 11;           // zona de influencia, en milésimas de unidad de mapa
  repeated Punto zona = 12;              // polígono real recortado por fronteras (derivado, solo lectura)
  Poblacion poblacion = 13;
  // Por id de recurso. Cambia en el paso de minuto: cada `Existencia.cantidad` viene `en_escalones = true`, con su tendencia «+N/min»
  // en `por_minuto` (el cliente muestra el valor del servidor y esa tendencia, no interpola).
  map<string, Existencia> almacen = 14;
  repeated Edificio edificios = 15;
  repeated Recinto recintos = 16;
  Cargos cargos = 17;
  repeated string casas_compradas = 18;  // héroes que residen
  repeated GrupoPuerta puerta_cerrada_a = 19;
  optional string capital_de_faccion_id = 20;
  repeated string vetados_ids = 21;
  repeated PoliticaActiva politicas_activas = 22;
  optional int64 ocupacion_hasta_ms = 23;
  optional int64 bandidos_reaparecen_en_ms = 24;
  optional int64 protegida_hasta_ms = 25;
  optional AscensoEnCurso ascenso = 26;
  Ritmo medidor_mantenimiento = 27;      // 0..100
  Ritmo nutricion = 28;                  // 0..100
  bool auto_construccion_pausada = 29;
  repeated string recetas_pausadas = 30;
  bool permite_reabastecer_aliados = 31;
  Cantidades reserva_manual = 32;
  optional int64 ultima_caravana_creada_en_ms = 33;
  // Guerra logística (Doc 4.2.2, 5.17):
  repeated string pueblos_ids = 34;
  repeated string avanzadas_ids = 35;
  // La ciudad que el cliente dibuja: la calcula el servidor (el cliente no recalcula nada). Ausente en las plazas ajenas redactadas.
  optional TrazadoUrbano trazado = 36;
  // Asedio visible (3.ª ronda de «entrar con todo»): la batalla que se juega ahora contra esta plaza. Con ella el cliente ofrece unirse
  // (`Batalla.lado_para_unirse`).
  optional string batalla_id = 37;
  // El interior visto desde dentro (4H T3c), todo en ids del contrato:
  repeated string guarnicion_ids = 38;           // las escuadras (`esc-N`) en la guarnición de la plaza: las de sus residentes que se quedan dentro
  uint32 cupo_guarnicion = 39;                   // cuántos soldados admite la guarnición (nivel, recintos completos, Palacio, políticas)
  repeated string presentes_ids = 40;            // los héroes que están dentro ahora: residentes y visitantes (su ficha pública llega por `VISTA`; aquí solo quiénes)
  repeated string caravanas_aparcadas_ids = 41;  // las caravanas aparcadas en la plaza, de quien sean
  repeated string flota_ids = 42;                // las caravanas de la plaza (su origen), estén donde estén
  // La secuencia propia del interior de la plaza (el contador de pasos de minuto): lo que cambia el paso de minuto (almacén, población, medidor,
  // nutrición, edificios parados, tendencia y el almacén local de los pueblos) NO avanza `version` (la del mundo) sino esta. Avanza de uno en uno
  // en cada paso de minuto de la plaza, igual con sesiones y sin ellas; un cambio parcial del paso de minuto la lleva siempre (máscara
  // `version_interior`, detrás de `version`) y una reanudación la compara con la del cliente (`Hola.versiones_interiores_conocidas`).
  uint64 version_interior = 43;
  // Sus misiones (Misiones §5): interior (quien está dentro o la gobierna) y `ADMIN`.
  repeated Mision misiones = 44;
}

// Rectángulo en UNIDADES LOCALES del asentamiento (esquina mínima y tamaño). El espacio local está centrado en el Centro Urbano.
message RectLocal {
  sint32 x = 1;
  sint32 y = 2;
  uint32 ancho = 3;
  uint32 alto = 4;
}

// Lo que el cliente necesita para dibujar la ciudad (Trazado_Urbano §10); los edificios con su huella están en `Asentamiento.edificios`
// (`ancho`/`alto`) y los recintos de muralla en `Asentamiento.recintos` (sus celdas, de `unidades_por_celda` de lado).
message TrazadoUrbano {
  uint32 layout_version = 1;             // versión del algoritmo de trazado: un cliente que no la conozca dibuja, no recalcula
  uint32 unidades_por_celda = 2;         // 3
  sint32 radio_ul = 3;                   // `radioCiudad` actual: el disco urbano
  repeated RectLocal calles = 4;
  repeated RectLocal caminos = 5;
}

// Pueblo extractor: extractor de mapa + almacén local + carro de acarreo + guarnición de serie. No es un asentamiento.
message Pueblo {
  string id = 1;
  uint64 version = 2;
  string asentamiento_madre_id = 3;
  string nodo_id = 4;
  string tipo_extractor = 5;             // id de catálogo (cantera, mina, minaCobre...)
  Punto posicion = 6;
  Existencia almacen_local = 7;          // cantidad como ritmo (extracción); capacidad 500
  optional string carro_acarreo_id = 8;  // caravana de tipo acarreo; ausente = hay que reponerlo
  optional string guarnicion_escuadron_id = 9;
  optional int64 guarnicion_repone_en_ms = 10;
  optional string batalla_id = 11;       // asedio visible: el saqueo que se juega ahora
  // La secuencia interior de su plaza madre (`Asentamiento.version_interior`) en el momento en que se proyectó: el paso de minuto refresca el
  // almacén local sin avanzar `version`, así que esta dice de qué minuto es. Solo `ASENTAMIENTO` lo refresca por minuto (en `FACCION` el
  // almacén local llega con el último cambio discreto del pueblo).
  uint64 version_interior = 12;
}

enum EstadoAvanzada {
  ESTADO_AVANZADA_NO_ESPECIFICADO = 0;
  AVANZADA_ACTIVA = 1;
  AVANZADA_EN_RUINAS = 2;                // fuerte y ciudadela; no funciona nada
}

message Avanzada {
  string id = 1;
  uint64 version = 2;
  string asentamiento_madre_id = 3;
  uint32 etapa = 4;                      // 1 atalaya, 2 fuerte, 3 ciudadela
  Punto posicion = 5;
  EstadoAvanzada estado = 6;
  sint64 radio_vision = 7;               // 12 unidades (en milésimas), fijo
  Existencia almacen = 8;                // sin uso: el almacén de una avanzada es por recurso (`almacen_por_recurso`)
  repeated string guarnicion_serie_ids = 9;    // escuadras de serie (IA, fuera de cupo)
  optional string tropa_elegida_escalon2 = 10; // la elige el Gobernador de la madre (= `tropa_elegida_por_escalon[2]`; se conserva por v1)
  optional int64 invulnerable_hasta_ms = 11;   // fuerte en ruinas: 1 día
  map<uint32, string> tropa_elegida_por_escalon = 12; // escalón (2, 3 o 4) → tropa elegida de las que la madre recluta
  repeated string guarnicion_jugadores_ids = 13;      // escuadrones de jugadores dejados con `guarnecer_avanzada` (dentro del cupo)
  optional string batalla_id = 14;       // asedio visible: el ataque que se juega ahora
  map<string, Existencia> almacen_por_recurso = 15; // fuerte y ciudadela: lo que hay de cada recurso (id de catálogo); la atalaya no tiene almacén
}

enum TipoObra {
  TIPO_OBRA_NO_ESPECIFICADO = 0;
  OBRA_PUEBLO = 1;
  OBRA_AVANZADA = 2;
  OBRA_MEJORA_AVANZADA = 3;
  OBRA_REPARACION = 4;
}

// Obra de mapa «pendiente de materiales»: se ve en el mapa pero no se puede atacar; ocupa cupo desde que se marca.
message ObraDeMapa {
  string id = 1;
  uint64 version = 2;
  string asentamiento_madre_id = 3;
  TipoObra tipo = 4;
  Punto posicion = 5;
  optional string nodo_id = 6;           // pueblos
  optional string destino_id = 7;        // mejora o reparación de una avanzada
  Cantidades requerido = 8;
  Cantidades entregado = 9;
  optional int64 inicia_en_ms = 10;
  optional int64 termina_en_ms = 11;     // presente cuando arranca la obra
}

message NodoRecurso {
  string id = 1;
  uint64 version = 2;
  string tipo = 3;
  string rareza = 4;                     // comun | intermedio | raro
  Punto posicion = 5;
  sint64 cantidad_inicial = 6;
  Existencia stock = 7;
  optional int64 regenera_en_ms = 8;
  optional string anillo = 9;            // foco | frontera | lejana (del artefacto de mundo)
}

message ZonaBosque {
  string id = 1;
  Punto centro = 2;
  sint64 radio = 3;
  uint32 densidad_milesimas = 4;         // 0..1000
  reserved 5;                            // antes `capacidad_lenera`: ahora el cupo son las parcelas
  uint64 area = 6;                       // milésimas² de unidad estratégica
}

// Cupo de explotación de una masa de bosque (Doc 1.9c). Fija en el artefacto; ocupada cuando una Leñera la tiene en
// `Edificio.fuente_id`. La Leñera se construye en la ciudad; la parcela solo dice de qué parte del bosque vive.
message ParcelaBosque {
  string id = 1;
  string bosque_id = 2;
  Punto centro = 3;
  uint32 densidad_milesimas = 4;         // media de la densidad bajo la parcela
  optional string anillo = 5;
}

// ───────────────────────────── Héroe y tropa ─────────────────────────────

message Atributos {
  uint32 fuerza = 1;
  uint32 destreza = 2;
  uint32 armadura = 3;
  uint32 vitalidad = 4;
}

message Monedas {
  uint64 bronce = 1;
  uint64 plata = 2;
  uint64 oro = 3;
}

message Estadistica {
  string nombre = 1;
  sint64 valor = 2;
}

message ItemInstancia {
  string item_definition_id = 1;
  string tipo = 2;                       // arma | armadura | consumible | visual
  uint32 cantidad = 3;
  optional string item_instance_id = 4;
  repeated Estadistica estadisticas = 5;
  uint32 precio = 6;
  uint32 casilla_inventario = 7;
}

message Equipamiento {
  optional ItemInstancia arma = 1;
  optional ItemInstancia casco = 2;
  optional ItemInstancia torso = 3;
  optional ItemInstancia guantes = 4;
  optional ItemInstancia pantalones = 5;
  optional ItemInstancia botas = 6;
}

message Avatar {
  string cabeza_id = 1;
  string pelo_id = 2;
  string barba_id = 3;
  string cejas_id = 4;
}

message Loadout {
  string id = 1;
  string display_name = 2;
  repeated string squad_ids = 3;
  repeated uint32 perks_seleccionados = 4;
  bool activo = 5;
  uint32 liderazgo_total = 6;            // derivado
}

message UbicacionHeroe {
  oneof donde {
    string asentamiento_id = 1;          // dentro de una plaza
    string ejercito_id = 2;              // en el mapa, en su columna
    string campamento_id = 3;            // dentro de un campamento de mercenarios
    Punto desconectado_en = 4;           // fuera del mundo (solo si salió con su columna)
    string pueblo_id = 5;                // dentro de un pueblo extractor (entrar con todo: su columna queda fuera del mapa)
    string avanzada_id = 6;              // dentro de una avanzada
  }
}

message CupoCampamento {
  uint32 dia = 1;
  map<string, uint32> comprado = 2;
}

message Heroe {
  string id = 1;
  uint64 version = 2;
  optional string jugador_id = 3;
  bool es_bot = 4;
  string display_name = 5;
  string class_definition_id = 6;
  bool femenino = 7;
  Avatar avatar = 8;
  uint32 nivel = 9;
  uint64 experiencia_hacia_siguiente_nivel = 10;
  uint32 puntos_de_atributo_sin_gastar = 11;
  uint32 puntos_de_perk_sin_gastar = 12;
  Atributos atributos_base = 13;
  repeated uint32 perks_desbloqueados = 14;
  uint32 liderazgo_base = 15;
  UbicacionHeroe ubicacion = 16;
  Cantidades almacen_personal = 17;      // vive donde se reside
  optional CupoCampamento cupo_campamento = 18;
  optional int64 racion_en_ms = 19;
  optional Ritmo viveres = 20;           // los víveres propios (en un ejército, los del ejército; ver Ejercito.viveres)
  repeated int64 bandidos_destruidos_en_ms = 21;
  repeated string alijos_abiertos = 22;
  optional int64 herido_hasta_ms = 23;
  optional int64 desconecta_en_ms = 24;
  optional Cantidades fuera_carro = 25;  // carro de quien salió del mundo con su columna
  repeated string escuadrones_ids = 26;
  repeated Loadout loadouts = 27;
  repeated ItemInstancia inventario = 28;
  Equipamiento equipamiento = 29;
  Monedas monedas_heroe = 30;
  uint32 cupo_guarnicion = 31;           // derivado
  bytes exploracion_personal = 32;       // máscara de lo explorado sin bandera
  map<string, InteriorRecordado> plazas_recordadas = 33;
  // Dónde reside (4H T3b): la plaza (`as-N`) o el campamento de mercenarios (`camp-N`) donde guarda su almacén personal y cuenta su cupo diario. Ausente si no reside en ninguno.
  optional string residencia_id = 34;
  // El héroe ajeno visto en la `VISTA` (4H T3d, `HeroePublico`, Doc 5.16.7): solo `id`, `version`, `display_name`, `class_definition_id`, `avatar`, `nivel`,
  // `herido_hasta_ms` y las escuadras que lleva consigo en su columna (tropa, cantidad y nivel). Nada de su campamento, sus puntos, su Liderazgo ni si es humano o bot.
  repeated EscuadraQueLleva escuadras_que_lleva = 35;
  // Cuánto cabe en total en su almacén personal (5G-a, derivado de `ALMACEN_PERSONAL.capacidad`; milésimas): lo que pueden llenar `guardar_en_almacen_personal` y las compras del residente.
  sint64 capacidad_almacen_personal = 36;
  // Su ciudadanía (5H, 5B-11): la Facción de la que es ciudadano (`f-N`); ausente sin bandera. En el héroe propio (`HEROE`), en `ADMIN` y, desde el 2026-10-27, también en el héroe público de la `VISTA`.
  optional string faccion_id = 37;
  // Las Facciones a las que ha pedido el ingreso y aún no han contestado (5H, Diplomacia §3.2): lo que el solicitante ve de sus solicitudes (la Facción las ve en `Faccion.solicitudes_ids`).
  repeated string solicitudes_faccion_ids = 38;
  // Sus misiones (Misiones §5): solo en el héroe propio (`HEROE`) y en `ADMIN`.
  repeated Mision misiones = 39;
}

// Una escuadra que un héroe ajeno lleva en su columna, tal como se ve (`HeroePublico.escuadrasQueLleva`).
message EscuadraQueLleva {
  string tropa_id = 1;
  uint32 cantidad = 2;
  uint32 nivel = 3;
}

// Foto del interior de una plaza al salir de ella.
message InteriorRecordado {
  int64 visto_en_ms = 1;
  map<string, Existencia> almacen = 2;
  repeated Edificio cola = 3;
  repeated string guarnicion_escuadrones_ids = 4;
}

// Dónde está una escuadra. Regla: la tropa que va con su héroe se queda con su héroe; la que está fuera de su columna
// (guarnición, escolta) es tropa PRESTADA y vuelve sin viaje al campamento de su héroe si no puede seguir donde está.
message ContenedorEscuadron {
  oneof donde {
    bool campamento = 1;                 // en el campamento del héroe
    string ejercito_id = 2;              // en su columna
    string caravana_id = 3;              // escolta cedida
    bool fuera = 4;                      // héroe desconectado
    string avanzada_id = 5;              // en la guarnición de una avanzada (`guarnecer_avanzada`), fuera del campamento de su plaza
  }
}

message ReservaBatalla {
  string battle_id = 1;
}

message Escuadron {
  string id = 1;
  uint64 version = 2;
  string nombre = 3;
  string heroe_id = 4;
  string origen = 5;                     // pesants | artesanos | nobleza
  string tropa_id = 6;
  uint32 cantidad = 7;
  uint32 nivel = 8;
  sint64 experiencia = 9;
  Ritmo moral = 10;                      // 0..100
  repeated string habilidades_desbloqueadas = 11;
  repeated uint32 formaciones_desbloqueadas = 12;
  uint32 formacion_seleccionada = 13;
  ContenedorEscuadron contenedor = 14;
  bool en_guarnicion = 15;
  optional ReservaBatalla reserva_batalla = 16;
  optional string prestada_por_campamento_id = 17;
}

// ───────────────────────────── Columnas y caravanas ─────────────────────────────

enum EstadoColumna {
  ESTADO_COLUMNA_NO_ESPECIFICADO = 0;
  COLUMNA_MARCHANDO = 1;
  COLUMNA_ESTACIONADA = 2;
}

enum TipoColumna {
  TIPO_COLUMNA_NO_ESPECIFICADO = 0;
  COLUMNA_PERSONAL = 1;
  COLUMNA_EJERCITO = 2;
}

enum PoliticaUnion {
  POLITICA_UNION_NO_ESPECIFICADA = 0;
  UNION_RECHAZAR = 1;
  UNION_ACEPTAR = 2;
  UNION_PREGUNTAR = 3;
}

message Participante {
  string heroe_id = 1;
  int64 unido_en_ms = 2;
}

message PeticionUnion {
  string heroe_id = 1;
  int64 pedido_en_ms = 2;
  int64 expira_en_ms = 3;
}

message Persecucion {
  bool presa_es_caravana = 1;
  string presa_id = 2;
  optional Punto destino = 3;            // punto de intercepción calculado
}

// Una columna: personal o ejército (un conjunto de héroes con sus columnas, caravanas adjuntas y víveres propios).
// NO tiene destino fijo ni origen: no vuelve sola a ningún sitio.
message Ejercito {
  string id = 1;
  uint64 version = 2;
  string faccion_id = 3;
  repeated Participante participantes = 4;
  TipoColumna tipo = 5;
  string lider_id = 6;
  PoliticaUnion politica_de_union = 7;
  repeated PeticionUnion peticiones_de_union = 8;
  repeated string escuadron_ids = 9;
  Cantidades suministro = 10;            // el carro (carga)
  // Trigo que se come; capacidad = suma de la de sus héroes. Va en unidades enteras con resto oculto (EE-3, 2026-10-24): el ritmo es el valor
  // exacto y el cliente lo enseña redondeado HACIA ARRIBA a unidades (la unidad que se está comiendo sigue hasta acabarse); se acaban cuando el
  // valor exacto llega a 0.
  Ritmo viveres = 11;
  sint64 capacidad_viveres = 12;
  optional int64 formacion_expira_en_ms = 13;
  optional Persecucion persiguiendo = 14;
  repeated string caravanas_adjuntas_ids = 15;
  EstadoColumna estado = 16;
  Punto posicion = 17;                   // posición cuando no hay plan; con plan, la de su primer vértice (lo ajeno: donde empieza el tramo visible)
  optional Plan plan = 18;               // lo propio viaja entero; lo ajeno, solo el tramo visible (horizonte corto)
  bool te_sigue = 19;                    // solo en la proyección: persigue a una columna tuya
  // La columna que entró en un lugar (plaza `as-N`, pueblo `pueblo-N`, avanzada `av-N` o campamento `camp-N`) ya no está en el mapa:
  // queda dentro con todo lo suyo hasta que sale. Sin plan ni `posicion` válida mientras tanto.
  optional string dentro_de = 20;
  bool en_batalla = 21;                  // apartada por una batalla de Unity: no se mueve ni recibe órdenes
  optional string batalla_id = 22;
  // De quién es el suelo que pisa ahora (4H T7, `territorioPorEjercito` de Niebla_De_Guerra §5.4): la Facción dueña de la zona de influencia que contiene a la
  // columna, de cualquier Facción y aunque su plaza no se vea, o vacío en tierra de nadie; nunca qué plaza. Solo en `VISTA` y solo de las columnas propias; ausente en los demás
  // ámbitos y en lo ajeno. Se renueva en el muestreo de la vista cuando la columna cruza una frontera.
  optional string territorio_faccion_id = 23;
  // Marcha forzada (Movimiento_Ejercitos §marcha forzada): la columna va más deprisa y gasta más víveres mientras marcha. Solo en lo propio;
  // lo ajeno siempre la lleva a false (las otras Facciones no la ven).
  bool marcha_forzada = 24;
  // La Caravana de Fundación (`car-N`) que lleva enganchada (Fundacion_Y_Refundacion §6.1), en lo propio y en lo ajeno avistado: el cliente la pinta pegada detrás. Las comerciales van en
  // `caravanas_adjuntas_ids`.
  optional string caravana_fundacion_id = 25;
}

enum EstadoCaravana {
  ESTADO_CARAVANA_NO_ESPECIFICADO = 0;
  CARAVANA_DISPONIBLE = 1;
  CARAVANA_PREPARANDO = 2;
  CARAVANA_ADJUNTA = 3;
  CARAVANA_APARCADA = 4;                 // si cae la plaza anfitriona, se destruye
  CARAVANA_EN_TRANSITO = 5;
  CARAVANA_RETORNANDO = 6;
}

enum TipoCaravana {
  TIPO_CARAVANA_NO_ESPECIFICADO = 0;
  CARAVANA_COMERCIAL = 1;
  CARAVANA_DE_FUNDACION = 2;
  CARAVANA_DE_ACARREO = 3;               // ligada a un pueblo extractor; sale solo con el carro lleno
}

message CarroCaravana {
  string tipo_carro = 1;                 // basico | reforzado
  optional string animal = 2;            // buey | caballo | camello
}

message Peaje {
  string asentamiento_id = 1;
  int64 en_ms = 2;                       // instante en que el plan cruza esa zona
}

message Caravana {
  string id = 1;
  uint64 version = 2;
  TipoCaravana tipo = 3;
  string origen_asentamiento_id = 4;
  optional string origen_campamento_id = 5;
  optional string faccion_id = 6;
  optional string destino_asentamiento_id = 7;
  Cantidades contenido = 8;
  Punto posicion = 9;
  optional Plan plan = 10;
  repeated Peaje peajes = 11;
  optional string origen_acuerdo_id = 12;
  optional string lado_acuerdo = 13;     // A | B
  optional string titular_id = 14;
  optional int64 caduca_en_ms = 15;
  map<string, Cantidades> aportes = 16;
  EstadoCaravana estado = 17;
  repeated CarroCaravana carros = 18;
  repeated string escolta_ids = 19;
  bool reservada_manual = 20;
  optional int64 prepara_hasta_ms = 21;
  optional string pueblo_id = 22;        // acarreo
  // Solo en la proyección: «llama la atención» (caravana grande), tramo visible, recursos sin cantidades.
  bool escoltada = 23;
  // La caravana ajena vista en la `VISTA` (4H T3d, `CaravanaAvistada`): solo `id`, `version`, `faccion_id`, `posicion`, el tramo visible del plan, `escoltada` y los
  // recursos que lleva, por nombre, sin cantidades y ordenados (`contenido` va vacío).
  repeated string recursos_avistados = 24;
}

message SeleccionDeSalida {
  repeated string escuadron_ids = 1;
  Cantidades carga = 2;
}

message IntegranteConvocatoria {
  string heroe_id = 1;
  int64 unido_en_ms = 2;
  SeleccionDeSalida seleccion = 3;
}

message PeticionConvocatoria {
  string heroe_id = 1;
  int64 pedido_en_ms = 2;
  int64 expira_en_ms = 3;
  SeleccionDeSalida seleccion = 4;
}

message Convocatoria {
  string id = 1;
  uint64 version = 2;
  string faccion_id = 3;
  bool lugar_es_campamento = 4;
  string lugar_id = 5;
  string lider_id = 6;
  PoliticaUnion politica_de_union = 7;   // aceptar | preguntar
  repeated IntegranteConvocatoria integrantes = 8;
  repeated PeticionConvocatoria peticiones = 9;
  int64 creada_en_ms = 10;
}

// ───────────────────────────── Campamentos, bandidos, alijos ─────────────────────────────

message CampamentoBandidos {
  string id = 1;
  uint64 version = 2;
  Punto posicion = 3;
  string bosque_id = 4;
  optional string asentamiento_id = 5;
  optional string campamento_mercenarios_id = 6;
  optional string veta_id = 7;           // los de las vetas de estaño y oro
  uint32 nivel = 8;                      // 1..3
  uint32 poder = 9;
}

// Un alijo de exploración (Generacion_Del_Mundo §12): en el artefacto (`ArtefactoDeMundo.alijos`) y, desde 6G, en `HEROE` los que el héroe tiene a la vista
// (si puede buscarlos y no los ha abierto: Niebla_De_Guerra §5.4), renovados con el muestreo de la vista. `oro` en milésimas, el del artefacto.
message Alijo {
  string id = 1;
  Punto posicion = 2;
  sint64 oro = 3;
}

message CampamentoMercenarios {
  string id = 1;
  uint64 version = 2;
  Punto posicion = 3;
  uint32 origen = 4;
  repeated string edificios = 5;         // taberna, vivienda, mercado, barracon, galeriaDeTiro, caballerizas
  repeated string residentes_ids = 6;
  uint32 eligieron_como_inicial = 7;
  optional int64 bandidos_en_ms = 8;
  Ritmo poblacion = 9;                   // se recupera como ritmo
  Cantidades mercado = 10;
  map<string, Cantidades> fondos = 11;   // por facción
  int64 creado_en_ms = 12;
  int64 repone_en_ms = 13;               // próxima reposición del mercado
  map<string, uint32> contadores_mercado = 14;
  // El campamento visto desde dentro (4H T3c):
  repeated string presentes_ids = 15;    // los héroes que están dentro ahora: residentes y visitantes
  repeated string prestamos_ids = 16;    // las escuadras (`esc-N`) que este campamento tiene prestadas, estén donde estén
  repeated string tropas_ofrecidas = 17; // las tropas que se pueden reclutar (su edificio militar, su nivel y las tecnologías desbloqueadas)
  Cantidades cupo_diario = 18;           // el tope diario por bien con cupo (lo comprado hoy de cada héroe está en `Heroe.cupo_campamento`)
  // La planta (paridad P7, `layoutCampamento`): presentación pura, siempre la misma para el mismo campamento. Las piezas van como los `Edificio` de una plaza
  // (`id` = `camp-N-K`, `tipo`: taberna, mercado, puestoMercado, el militar, vivienda o un ancla como plazaDeArmas; `posicion`, `ancho` y `alto` en unidades
  // locales; `rotado`); el trazado y la empalizada (decorativa: dentro no hay combate), también en unidades locales.
  repeated Edificio planta = 19;
  TrazadoUrbano trazado = 20;
  repeated RectLocal empalizada = 21;
  repeated RectLocal empalizada_puerta = 22;
  // Lo que cobra el campamento, solo en `CAMPAMENTO` (2026-10-27; no en la `VISTA` ni en `ADMIN`). Se renueva cuando cambia, también sin cambiar la versión.
  // El precio de cada bien del mercado en ppm de oro por unidad (`precio_referencia` sobre el stock global de todas las plazas × `MERCENARIOS.margen`):
  // comprar `n` unidades cuesta ⌈n × precio / 1.000.000⌉ de oro, como `comprar_en_campamento`.
  map<string, sint64> precios_mercado = 23;
  // Solo para el residente: las tropas del edificio militar del campamento, con su precio para él y si están desbloqueadas.
  repeated TropaDeCampamento reclutables = 24;
}

// Una tropa del edificio militar de un campamento tal como la recluta su residente (`reclutar_en_campamento`, 2026-10-27).
message TropaDeCampamento {
  string tropa_id = 1;
  bool desbloqueada = 2;                 // su tecnología está desbloqueada en el campamento (las desbloqueadas son `tropas_ofrecidas`)
  sint64 precio_por_soldado = 3;         // milésimas de oro, con el recargo, la reputación de su Facción y el descuento sin plazas, antes de redondear
  sint64 precio_escuadra = 4;            // lo que cuesta una escuadra completa (`unidades` soldados), en milésimas, ya redondeado a oro entero
  uint32 unidades = 5;                   // soldados de una escuadra completa; reclutar cobra ⌈precio_por_soldado × los que faltan / 1.000⌉ de oro
}

// ───────────────────────────── Comercio ─────────────────────────────

message LineaTrueque {
  string recurso = 1;
  sint64 cantidad_total = 2;
  sint64 cantidad_entregada = 3;
}

enum EstadoTrueque {
  ESTADO_TRUEQUE_NO_ESPECIFICADO = 0;
  TRUEQUE_PROPUESTO = 1;
  TRUEQUE_ACTIVO = 2;
  TRUEQUE_RECHAZADO = 3;
  TRUEQUE_CUMPLIDO = 4;
  TRUEQUE_EXPIRADO = 5;
}

message AcuerdoTrueque {
  string id = 1;
  uint64 version = 2;
  string asentamiento_a_id = 3;
  string asentamiento_b_id = 4;
  repeated LineaTrueque lineas_a = 5;
  repeated LineaTrueque lineas_b = 6;
  int64 creado_en_ms = 7;
  int64 expira_en_ms = 8;
  EstadoTrueque estado = 9;
}

enum EstadoOrden {
  ESTADO_ORDEN_NO_ESPECIFICADO = 0;
  ORDEN_ACTIVA = 1;
  ORDEN_CUMPLIDA = 2;
  ORDEN_EXPIRADA = 3;
}

message OrdenMercado {
  string id = 1;
  uint64 version = 2;
  string asentamiento_id = 3;
  bool es_compra = 4;
  string recurso = 5;
  sint64 cantidad = 6;
  sint64 cantidad_cumplida = 7;
  sint64 precio_unitario = 8;
  int64 creado_en_ms = 9;
  int64 expira_en_ms = 10;
  EstadoOrden estado = 11;
}

message RutaComercial {
  string id = 1;
  string origen_id = 2;
  string destino_id = 3;
  string faccion_id = 4;
  repeated string aristas = 5;
  int64 ultimo_lanzamiento_ms = 6;
}

message RedCaminos {
  uint64 version = 1;
  repeated string aristas = 2;
  repeated RutaComercial rutas = 3;
  // El escalón de cada arista (4H T7), en el mismo orden que `aristas`: 0 sendero, 1 camino, 2 calzada (`escalonDePeso`, Comercio_Caravanas). En `VISTA`, `rutas` lleva
  // solo las de la propia Facción.
  repeated uint32 escalones = 4;
  // La red como se pinta (paridad P7, `tramosDeRed`): las mismas aristas fundidas en polilíneas, cada una de un solo escalón; un nodo de cruce corta el tramo.
  repeated TramoDeRed tramos = 5;
}

message TramoDeRed {
  string id = 1;                         // `tramo-N`, por orden: solo vale dentro de esta entidad
  uint32 escalon = 2;                    // 0 sendero, 1 camino, 2 calzada
  repeated Punto puntos = 3;
}

// ───────────────────────────── Tecnología, Aedas, intel ─────────────────────────────

// Las tecnologías de la Facción propia (`FACCION`; las de un rival no viajan nunca). Los tres conjuntos, ordenados por id (las adoptadas: las de arranque y
// después las demás); desde 6G, el detalle de cada revelada y las épicas que un Aeda residente de la Facción podría empezar ahora.
message TecnologiasFaccion {
  string faccion_id = 1;
  uint64 version = 2;
  repeated string aparecidas = 3;
  repeated string adoptadas = 4;
  repeated string reveladas = 5;
  repeated TecnologiaRevelada detalle_reveladas = 6;  // una por cada `reveladas`, en su orden
  repeated string epicas_posibles = 7;   // con épica, logro cumplido, Era abierta, no aparecida y sin un Aeda de la Facción que ya la cante
}

// Lo que un Aeda reveló a la Facción (Tecnologia_Aedas §6.3): quién la desbloqueó y, condición a condición de su hito (`TECNOLOGIAS.<id>.hito`, en su orden),
// si la Facción ya la cumple. El cliente compone la frase con el catálogo.
message TecnologiaRevelada {
  string tecnologia_id = 1;
  string descubridora_faccion_id = 2;
  repeated bool cumplidas = 3;
}

// Estado global de tecnología (Eras I-III; las IV y V se definen con el motor nuevo).
message EstadoTecnologia {
  string era = 1;
  int64 era_desde_ms = 2;
  map<string, sint64> contadores = 3;
  map<string, int64> logros = 4;
  map<string, PrimeroEnLograr> primeros = 5;
  repeated string cantadas = 6;
  // 6G: los logros cumplidos como hechos del mundo (`contador` llegó a `umbral` en `en_ms`), por orden, sin decir qué tecnología abren. La forma pública
  // (`HEROE`) solo lleva `era`, `era_desde_ms`, `logros_cumplidos`, `cantadas` y, de `primeros`, las ya cantadas; `contadores` y `logros` (por id de tecnología)
  // solo viajan a `ADMIN` (decisión Q6 del autor).
  repeated LogroCumplido logros_cumplidos = 7;
  // 6G, con la decisión del autor sobre 6B (cada Era dura un mínimo): desde cuándo puede empezar la siguiente si la vigente cumple todos sus logros
  // (`era_desde_ms` + el mínimo) y cuándo empieza por plazo aunque no los cumpla. Ausentes en la última Era. Públicos: no dicen si los logros están cumplidos.
  optional int64 era_minimo_hasta_ms = 8;
  optional int64 era_plazo_hasta_ms = 9;
}

message LogroCumplido {
  string contador = 1;                   // `extraido.cobre`, `plazasEnNivel.2`...
  sint64 umbral = 2;
  int64 en_ms = 3;
}

message PrimeroEnLograr {
  string faccion_id = 1;
  int64 en_ms = 2;
}

message EpicaEnCurso {
  string tecnologia_id = 1;
  uint32 capitulo = 2;
  uint32 hechos = 3;
  optional int64 ultimo_hecho_en_ms = 4;
  repeated string claves = 5;           // solo en `ADMIN`: la memoria de hechos ya contados
  uint32 capitulos = 6;                  // 6G: cuántos tiene la épica
  uint32 hechos_necesarios = 7;          // 6G: los que pide el capítulo en curso
}

// Un Aeda residente (`aeda-rN`), en `FACCION` de la dueña de su plaza (los rivales no ven los suyos) y en `ADMIN`; su épica, sin `claves` salvo en `ADMIN` (6G).
message AedaResidente {
  string id = 1;
  uint64 version = 2;
  string nombre = 3;
  string asentamiento_id = 4;
  string faccion_id = 5;
  int64 llegada_en_ms = 6;
  optional EpicaEnCurso epica = 7;
}

// Un Aeda itinerante (`aeda-N`). En `VISTA`, redactado como una columna ajena (6G): `posicion`, el tramo visible de su `plan` (horizonte corto, renovado) y la plaza
// en que está parado; nunca `hasta_ms`, `destino_id` ni `recientes`. En `ADMIN`, entero (`posicion` es donde se paró o de donde salió; con plan, el plan entero).
message AedaItinerante {
  string id = 1;
  uint64 version = 2;
  Punto posicion = 3;
  optional string en_asentamiento_id = 4;
  optional int64 hasta_ms = 5;
  optional string destino_id = 6;
  optional Plan plan = 7;
  repeated string recientes = 8;
}

// Una Mirada de la taberna (Niebla_De_Guerra §6.1): viaja en la `VISTA` de su Facción mientras su zona se enfría (`libre_en_ms`); ve mientras `expira_en_ms` no ha pasado.
message MiradaIntel {
  string id = 1;
  uint64 version = 2;
  string faccion_id = 3;
  string origen_id = 4;
  Punto centro = 5;
  sint64 radio = 6;
  int64 comprada_en_ms = 7;
  int64 expira_en_ms = 8;
  int64 libre_en_ms = 9;
}

message EdificioInforme {
  string tipo = 1;
  Punto posicion = 2;
  EstadoEdificio estado = 3;
  optional uint32 nivel_interno = 4;
  AmbitoEdificio ambito = 5;
}

message RecintoInforme {
  uint32 nivel = 1;
  repeated CeldaMuro celdas = 2;
  uint32 avance = 3;
}

message GuarnicionInforme {
  string tropa_id = 1;
  uint32 cantidad = 2;
  string heroe_id = 3;
}

// El último Informe de una plaza ajena que compró la Facción (§6.2), con su fecha: viaja en su `VISTA` (id `as-N`, clase `INFORME_PLAZA`).
message InformePlaza {
  string asentamiento_id = 1;
  uint64 version = 2;
  string faccion_id = 3;
  optional string nombre = 4;
  uint32 nivel = 5;
  int64 conocido_en_ms = 6;
  optional Punto posicion = 7;
  repeated EdificioInforme edificios = 8;
  repeated RecintoInforme recintos = 9;
  repeated GuarnicionInforme guarnicion = 10;
  repeated string heroes_ids = 11;
}

// Lo que un héroe sacó de mirar de cerca (`inspeccionar`, Doc 5.12.3): una columna ajena, una caravana o la defensa de una plaza. Vale
// 10 minutos (`expira_en_ms`) y lo ve solo quien lo hizo. Lo que se ve envejece: el cliente lo enseña con su fecha y con `donde`.
message InformeInspeccion {
  string id = 1;                         // `insp-<heroe>-<objetivo>`: uno por héroe y objetivo (el último sustituye)
  uint64 version = 2;
  string heroe_id = 3;                   // quien inspeccionó
  string objetivo_id = 4;                // `ej-N`, `car-N` o `as-N`
  int64 visto_en_ms = 5;
  int64 expira_en_ms = 6;
  Punto donde = 7;                       // dónde estaba el objetivo cuando se miró
  oneof contenido {
    InspeccionColumna columna = 10;
    InspeccionCaravana caravana = 11;
    InspeccionPlaza plaza = 12;
  }
}

message InspeccionColumna {
  optional string faccion_id = 1;
  repeated string heroes_ids = 2;
  repeated GuarnicionInforme escuadras = 3;   // cada escuadra con soldados en pie: tropa, cantidad y héroe; sin nivel, moral ni experiencia
}

// Nunca cuánto: solo qué recursos lleva y si va escoltada.
message InspeccionCaravana {
  bool escoltada = 1;
  repeated string recursos = 2;
}

// La defensa de una plaza ajena: sus residentes con tropa en guarnición, los héroes que hay dentro y los recintos de muralla (con su avance).
// El almacén, no.
message InspeccionPlaza {
  string faccion_id = 1;
  repeated string heroes_ids = 2;
  repeated GuarnicionInforme guarnicion = 3;
  repeated RecintoInforme recintos = 4;
}

// Ficha de un sitio ajeno que la Facción vio alguna vez (última foto, con su fecha): una plaza, un pueblo o una avanzada («se recuerdan como una ciudad»).
// Cómo estaba un sitio recordado cuando se vio (4H, decisión del autor del 2026-10-24; Niebla_De_Guerra §4.1).
enum EstadoSitio {
  ESTADO_SITIO_NO_ESPECIFICADO = 0;
  SITIO_ACTIVO = 1;
  SITIO_EN_OBRA = 2;                     // un pueblo o una avanzada que se levanta, o una avanzada que se mejora o se repara
  SITIO_EN_RUINAS = 3;                   // una avanzada arruinada (fuerte o ciudadela)
}

message FichaConocida {
  string asentamiento_id = 1;            // el id del sitio: `as-N`, `pueblo-N` o `av-N` (4H T3d; v1 decía solo plazas)
  optional string nombre = 2;
  string faccion_id = 3;                 // vacío: no es de nadie (las ruinas de una ciudadela sin dueño)
  Punto posicion = 4;
  uint32 nivel = 5;                      // de una plaza, su nivel; de una avanzada, su etapa (1 atalaya, 2 fuerte, 3 ciudadela); de un pueblo, 0
  int64 conocido_en_ms = 6;
  optional sint64 radio_potencial = 7;   // solo de una plaza: hasta dónde llegaba su zona cuando se vio
  TipoEntidad tipo = 8;                  // ASENTAMIENTO, PUEBLO o AVANZADA (sin especificar = ASENTAMIENTO, la de v1)
  EstadoSitio estado = 9;                // tal como estaba cuando se vio
}

// Memoria de la Facción: lo explorado y lo conocido. Lo explorado es una máscara de bits sobre la rejilla (celda de 5
// unidades; ver Niebla_De_Guerra.md); `exploracion` va en hexadecimal binario (bytes), 1 bit por celda.
message MemoriaFaccion {
  string faccion_id = 1;
  uint64 version = 2;
  bytes exploracion = 3;
  map<string, FichaConocida> asentamientos = 4;
  map<string, InformePlaza> informes = 5;
}

// Máscara de niebla que viaja con la vista: dos máscaras sobre la misma rejilla y su geometría.
message NieblaProyectada {
  uint32 tamano_celda = 1;               // en milésimas de unidad
  uint32 columnas = 2;
  uint32 filas = 3;
  bytes celdas = 4;                      // explorado alguna vez
  bytes visibles = 5;                    // visible ahora (incluye visión prestada)
  // 4H T6: cambio parcial, solo en una `Delta` (una `Foto` la trae siempre entera). Con `parcial`, `celdas` y `visibles` vienen vacíos y el cliente sobrescribe,
  // en las dos máscaras que ya tiene de este ámbito (con las mismas dimensiones), los bytes de cada tramo; lo que no está en un tramo no cambió.
  bool parcial = 6;
  repeated TramoDeNiebla tramos_celdas = 7;
  repeated TramoDeNiebla tramos_visibles = 8;
}

// Los bytes de una máscara de niebla que cambiaron: a partir del byte `desde`, `datos` sustituye a los que había.
message TramoDeNiebla {
  uint32 desde = 1;
  bytes datos = 2;
}

message ZonaFaccion {
  string faccion_id = 1;
  repeated ContornoZona contornos = 2;
}

message ContornoZona {
  repeated Punto puntos = 1;
}
