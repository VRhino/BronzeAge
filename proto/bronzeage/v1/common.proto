// Contrato 05 de BronzeAge — tipos comunes.
//
// Convenciones (valen para todo el contrato):
//  * TIEMPO: instantes de mundo en milisegundos desde la época 2026-01-01T00:00:00Z, `int64`, campos `*_ms`.
//    Duraciones, también en ms. El reloj de mundo es continuo (no hay tick); ver Docs/Mechanics/Reloj_Y_Eventos.md.
//  * ESPACIO: coordenadas del mapa ESTRATÉGICO (2.667 x 2.000 unidades) en MILÉSIMAS de unidad, `sint64`
//    (punto fijo: las reproducciones son idénticas en cualquier máquina). Unity usa el factor 12 sobre el mismo artefacto.
//  * CANTIDADES de juego (recursos, víveres, oro, ritmos): enteros en MILÉSIMAS, `sint64`.
//  * IDENTIFICADORES de catálogo (recursos, edificios, tropas, tecnologías, políticas): cadenas estables del archivo
//    común de datos de juego, no enumeraciones: añadir contenido no cambia el contrato.
//  * PRESENCIA: los campos `optional` y los mensajes distinguen «no viene» de «valor por defecto». Una entidad viaja COMPLETA y sustituye
//    a la anterior (`Cambio.reemplaza`); solo el `Asentamiento` puede ir parcial, con la máscara `Cambio.campos` (decisión del autor,
//    2026-10-22). `Cambio.campos_borrados` es la forma de v1 para borrar un campo opcional en una actualización parcial.
//  * IDENTIFICADORES de entidad: cadenas `<prefijo>-<n>`, todas con la misma forma, la Facción también: `f-3` Facción, `as-7` asentamiento,
//    `heroe-4`, `esc-9` escuadrón, `ej-2` ejército (columna), `car-5` caravana, `conv-1` convocatoria, `camp-0` campamento de mercenarios
//    (índice del artefacto de mundo), `band-6` campamento de bandidos, `acu-3` trueque, `ord-8` orden de mercado, `pueblo-5`, `av-5`,
//    `obra-5`, `loadout-2`, `nodo-12` (el índice del nodo en el artefacto de mundo). Lo que solo existe dentro de una plaza lleva la plaza: `ed-<plaza>-<n>` (edificio), `recinto-<plaza>-<n>`.
//    La batalla es la excepción: su id es un UUID (el contrato v1 de Unity). Un id nunca se reutiliza dentro de una partida.
//  * Los nombres de campo son snake_case en español (el dominio); los mensajes de batalla compartidos con Unity
//    conservan los nombres en inglés del contrato v1 (BattleTicket, BattleResult...).
syntax = "proto3";

package bronzeage.v1;

option csharp_namespace = "BronzeAge.Contract.V1";

// Punto del mapa estratégico, en milésimas de unidad.
message Punto {
  sint64 x = 1;
  sint64 y = 2;
}

// Un vértice de un plan de movimiento: dónde está la columna y A QUÉ INSTANTE pasa por él.
message Vertice {
  Punto p = 1;
  int64 en_ms = 2;
}

// Plan de movimiento: la posición en cualquier instante es la interpolación lineal entre vértices consecutivos.
// Antes del primer vértice la entidad está en él; después del último, se queda en él.
// `generacion` sube con cada plan nuevo; un cambio de plan EMPIEZA donde está la entidad en ese instante.
message Plan {
  uint32 generacion = 1;
  repeated Vertice vertices = 2;
}

// Ritmo: valor(t) = clamp(valor_en_t0 + por_minuto * (t - t0) / 60000, minimo, maximo).
// Todas las cantidades en milésimas. Sirve para almacenes, víveres, población, medidor, reputación...
//
// ESCALONES (economía por minuto, decisión del autor del 2026-10-22): con `en_escalones = true` el valor NO es una recta, sino un
// escalón que el servidor renueva en cada paso de minuto de la plaza: el cliente NO interpola, muestra `valor_en_t0` tal cual y
// rotula `por_minuto` como TENDENCIA «+N/min» (el neto real del último paso: producción − consumo − mantenimiento, ya con los gastos
// de ese minuto; no el de cada orden). Con `en_escalones = false` (por defecto, la semántica v1) se evalúa la recta en cada fotograma.
message Ritmo {
  sint64 valor_en_t0 = 1;
  int64 t0_ms = 2;
  sint64 por_minuto = 3;
  optional sint64 maximo = 4;
  optional sint64 minimo = 5;
  bool en_escalones = 6;
}

// Un recurso almacenado: cantidad (como ritmo) y capacidad.
//
// ENTERO (economía entera, decisión C3b del autor del 2026-10-24): todo lo almacenado —almacenes de plaza, pueblo y avanzada, carros,
// caravanas, almacén personal y existencias de los campamentos— guarda unidades enteras, así que `cantidad.valor_en_t0` es siempre
// múltiplo de 1.000. La fracción que llevan los flujos por minuto (producción, comida, mantenimiento, recaudación) es un «resto oculto»
// del servidor y NO viaja; `cantidad.por_minuto` (la tendencia) sí es el neto exacto del último paso y puede no ser múltiplo de 1.000.
// Una unidad que se está consumiendo sigue en `valor_en_t0` hasta que su consumo se completa (EE-2), así que lo que se puede mover o vender puede
// ser una unidad menos que lo que se ve.
// La capacidad puede no ser entera (sale de factores): lo que cabe es su parte entera.
//
// PRODUCIDO Y CONSUMIDO (mecánica 60, 2026-10-28): en el almacén de una plaza, `producido_por_minuto` es lo que entró de ese recurso por los
// flujos del último paso de minuto (Granjas, Leñeras, extracción, recetas, recaudación) y `consumido_por_minuto` lo que salió (comida de la
// población y de la guarnición, mantenimiento, insumos de las recetas), por separado y en milésimas. El neto sigue en `cantidad.por_minuto`.
// No cuentan las entregas, las compras ni las obras (no son flujo por minuto). Fuera del almacén de una plaza (pueblos, avanzadas) van a 0.
//
// PRODUCCIÓN (2026-11-03): `produccion_por_minuto` es lo que rindieron de verdad esos flujos en el último paso, **quepa o no**: con el almacén
// lleno, `producido_por_minuto` baja a lo que entró (lo que dejó el consumo) y esto sigue diciendo lo que dan los edificios (lo que no cabe se
// pierde). Sin almacén lleno es igual a `producido_por_minuto`. Es la cifra para enseñar «produce / consume»; el neto real sigue en
// `cantidad.por_minuto`. Tras recuperar el servidor de una foto vale lo mismo que `producido_por_minuto` hasta el siguiente paso de minuto.
message Existencia {
  Ritmo cantidad = 1;
  sint64 capacidad = 2;
  sint64 producido_por_minuto = 3;
  sint64 consumido_por_minuto = 4;
  sint64 produccion_por_minuto = 5;
}

// Cantidades por id de catálogo (carros, cargas, aportes). En milésimas; lo almacenado (cargas de carro y de caravana, almacén personal,
// lo pactado de un trueque) es siempre múltiplo de 1.000 (C3b, 2026-10-24).
message Cantidades {
  map<string, sint64> por_id = 1;
}

// Una parada del encargo de una caravana (rutas de caravanas automáticas, 2026-10-31): qué recoge y qué deja en una punta; primero deja y luego
// recoge. En una plaza ajena, dejar es venderle a sus órdenes de compra y recoger es comprar a sus órdenes de venta;
// allí cada línea lleva su precio (en la unidad de `OrdenMercado.precio_unitario`) y en una plaza propia no lleva ninguno.
message ParadaEncargo {
  repeated LineaRecoger recoger = 1;
  // Con `true`, la caravana no carga hasta que el almacén tiene todo lo pedido (sin plazo); con `false`, sale con lo que haya.
  bool esperar_existencias = 2;
  repeated LineaDejar dejar = 3;
  // Con `true`, lo que no cabe en el almacén se tira; con `false`, se queda a bordo. En una plaza ajena no cuenta: lo que no se vende vuelve a bordo.
  bool desechar_sobrante = 4;
}

message LineaRecoger {
  string recurso = 1;  // id de catálogo
  sint64 cantidad = 2;  // milésimas (unidades enteras)
  optional sint64 precio_max = 3;  // solo en una plaza ajena: compra a las órdenes de venta con precio ≤ este
}

message LineaDejar {
  string recurso = 1;  // id de catálogo
  optional sint64 tope = 2;  // milésimas; sin tope deja todo lo que lleve de ese recurso
  optional sint64 precio_min = 3;  // solo en una plaza ajena: vende a las órdenes de compra con precio ≥ este
}

// A qué apunta un contrato o una orden de mercenario (Mercenarios_Por_Contrato §4 y §6; 2026-11-01). Lo comparten las órdenes y las entidades. `caravana_id` vale también
// para el carro de acarreo de un pueblo, un encargo o una ruta: en el motor todo eso es una caravana. `campamento_id` es un campamento de bandidos. `punto`, solo para `ir_a`.
message ObjetivoMercenario {
  oneof tipo {
    string asentamiento_id = 1;
    string pueblo_id = 2;
    string avanzada_id = 3;
    string caravana_id = 4;
    string campamento_id = 5;
    string ejercito_id = 6;
    string convocatoria_id = 7;
    string faccion_id = 8;
    Punto punto = 9;
  }
}

message Sigilo {
  string forma_id = 1;
  string campo_id = 2;
  string emblema_id = 3;
  string color_primario_id = 4;
  string color_secundario_id = 5;
  string color_emblema_id = 6;
  string orla_id = 7;
  string color_orla_id = 8;
}

// Tipos de entidad con identidad propia en el almacén del cliente.
enum TipoEntidad {
  TIPO_ENTIDAD_NO_ESPECIFICADO = 0;
  FACCION = 1;
  ASENTAMIENTO = 2;
  HEROE = 3;
  ESCUADRON = 4;
  EJERCITO = 5;
  CARAVANA = 6;
  CONVOCATORIA = 7;
  CAMPAMENTO_MERCENARIOS = 8;
  CAMPAMENTO_BANDIDOS = 9;
  ALIJO = 10;
  ACUERDO_TRUEQUE = 11;
  ORDEN_MERCADO = 12;
  RELACION_POLITICA = 13;
  PROPUESTA = 14;
  TITULO = 15;
  AEDA = 16;
  MIRADA_INTEL = 17;
  INFORME_PLAZA = 18;
  BATALLA = 19;
  PUEBLO = 20;
  AVANZADA = 21;
  OBRA_DE_MAPA = 22;
  NODO_RECURSO = 23;
  MEMORIA_FACCION = 24;
  RED_CAMINOS = 25;
  TECNOLOGIA_FACCION = 26;
  ZONA_FACCION = 27;
  INFORME_INSPECCION = 28;
  // Solo para `ResultadoOrden.creadas` (no son entidades sueltas del almacén del cliente: el edificio y el recinto viven dentro de su
  // `Asentamiento`; la incorporación, dentro de su `Batalla`; el loadout, dentro de su `Heroe`):
  EDIFICIO = 29;
  RECINTO = 30;
  INCORPORACION = 31;                    // id `<battle_id>:<secuencia>`
  LOADOUT = 32;
  // La última foto de un sitio ajeno que la Facción vio y ya no ve (4H T3d, ámbito `VISTA`): su id es el del sitio (`as-N`, `pueblo-N`, `av-N`). Un sitio
  // que se ve viaja como su entidad (`ASENTAMIENTO`, `PUEBLO`, `AVANZADA`, `OBRA_DE_MAPA`); el que solo se recuerda, como ficha: nunca los dos a la vez.
  FICHA_CONOCIDA = 33;
  // El estado de tecnología del mundo (sistema 6, 6G), una sola entidad con id `tecnologia`: en `HEROE`, su forma pública (la Era, los logros
  // cumplidos sin decir qué abren, los descubrimientos ya cantados y, desde el 2026-11-06, los contadores en curso); en `ADMIN`, entero, con qué tecnología abre cada logro.
  ESTADO_TECNOLOGIA = 34;
  // El directorio público de todas las Facciones (2026-10-29, ámbito `VISTA`), una sola entidad con id `facciones`: de cada una, lo justo para listarla
  // (nombre, sigilo, nivel, cuántos ciudadanos tiene y si está derrotada). La forma pública completa sigue llegando como `FACCION` de las que nombra lo que se ve.
  DIRECTORIO_FACCIONES = 35;
}

// Ámbito de suscripción de una sesión. El servidor suscribe solo lo que corresponde al héroe (jamás lo pide el cliente):
//   HEROE (el propio), ASENTAMIENTO (donde está dentro), CAMPAMENTO (donde está dentro), BATALLA (en la que combate),
//   FACCION (la propia), VISTA (el mundo visible a la Facción, filtrado por niebla; `VISTA:f-N`, o `VISTA:heroe-N` para el héroe sin Facción, que
//   ve con su niebla personal).
// `ADMIN` solo para sesiones de administración.
enum AmbitoTipo {
  AMBITO_NO_ESPECIFICADO = 0;
  AMBITO_HEROE = 1;
  AMBITO_ASENTAMIENTO = 2;
  AMBITO_CAMPAMENTO = 3;
  AMBITO_BATALLA = 4;
  AMBITO_FACCION = 5;
  AMBITO_VISTA = 6;
  AMBITO_ADMIN = 7;
}

message Ambito {
  AmbitoTipo tipo = 1;
  string id = 2;
}

// Rectángulo en el mapa estratégico (milésimas), para fijar el interés de la vista.
message Rectangulo {
  Punto min = 1;
  Punto max = 2;
}
