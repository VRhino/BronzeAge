// Orden de ADMINISTRACIÓN (decisión del autor, 2026-10-22): una sola orden genérica para el andamiaje provisional del núcleo, SOLO para sesiones
// `CLIENTE_ADMIN_WEB` (cualquier otro cliente recibe `no_autorizado`). Desaparece cuando los sistemas 5 (política) y 6 (tecnología y Aedas) sustituyan
// estas órdenes. `codigo` es el nombre de la orden y `parametros` sus campos (los ids como en el resto del contrato; las cantidades en milésimas):
//   crear_ejercito {cuenta, faccion_id, posicion{x,y}, velocidad, viveres}    fijar_nivel_faccion {faccion_id, nivel}
//   dar_caravana_fundacion {ejercito_id}                                       fijar_nivel_asentamiento {asentamiento_id, nivel}
//   agrandar_zona {asentamiento_id}   reclamar_parcela {asentamiento_id}   soltar_parcela {asentamiento_id, parcela}
//   dar_recursos {asentamiento_id, recurso, cantidad}   dar_suministro {ejercito_id, recurso, cantidad}   dar_almacen_personal {heroe_id, recurso, cantidad}
//   fijar_residencia {heroe_id, residencia?}   fijar_tecnologias {faccion_id, tecnologias[]}   fijar_faccion_de_heroe {heroe_id, faccion_id?}
//   colocar_heroe {heroe_id, ubicacion}   herir_heroe {heroe_id}   fijar_relacion {faccion_a_id, faccion_b_id, relacion?}
//   colocar_bandidos {posicion{x,y}, nivel}   dar_escuadra {heroe_id, tropa_id, cantidad}   fijar_controlador {heroe_id, controlador}
//   fijar_catalogo_misiones {catalogo}   (el catálogo de las misiones recurrentes, JSON entero en texto; Misiones_Recurrentes §6)
// Las formas exactas las fija el núcleo al traducirlas (`Docs/Mechanics/Comandos_Parametros.md`, sección de administración).
message OrdenDeAdministracion {
  string codigo = 1;
  google.protobuf.Struct parametros = 2;
}

// Una orden del cliente. `peticion_id` es único por sesión y sirve de clave de idempotencia: reenviar la misma
// petición (p. ej. tras reconectar) no la ejecuta dos veces. `version_esperada`, si viene, rechaza la orden cuando el
// mundo ya cambió más allá de esa versión (para acciones que dependen de lo que el jugador estaba viendo).
message Orden {
  string peticion_id = 1;
