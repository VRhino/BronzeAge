// Contrato 05 de BronzeAge — órdenes (comandos) del cliente.
//
// Generado el 2026-10-13 desde `session/comandos/esquemas.ts` (la forma de params de los comandos del motor TypeScript) y
// revisado: se retira `replegarEjercito` (los ejércitos no tienen vuelta a casa; cancelar la marcha es `estacionar_ejercito`),
// `atacar` gana `declara_guerra` y los objetivos `pueblo` y `avanzada`, y se añaden las órdenes de la reconstrucción
// (repostar, reclamar caravana, obras de mapa, pueblos, avanzadas, control del reloj de administración).
// Las cantidades (recursos, oro, víveres) viajan en MILÉSIMAS (sint64); las coordenadas, en milésimas de unidad de mapa.
// Economía entera (C3b, 2026-10-24): lo almacenado va en unidades enteras, así que una cantidad que pide mover, cargar, pactar u ordenar
// recursos se redondea HACIA ABAJO a unidades (múltiplos de 1.000); menos de una unidad es nada (`cantidad_no_positiva` donde aplique).
// Los campos que eran cadenas de un catálogo cerrado se mantienen como string; los valores admitidos van en el comentario.
//
// 4H (2026-10-22): se añaden, al final de `Orden.cuerpo` y sin tocar nada de lo anterior, las órdenes del jugador que el núcleo ya tiene y faltaban
// (cancelar una orden de mercado, aparcar una caravana, retirar de y depositar en una avanzada, vaciar el carro, entrar y salir de pueblos y avanzadas),
// `OrdenRepostar.lugar_id` y la orden genérica de administración.
//
// Frontera: esto valida la FORMA. Que una entidad exista o que una cantidad esté en rango lo rechaza el núcleo con su
// propio código de error (RechazoOrden en session.proto), no el parseo.
syntax = "proto3";

package bronzeage.v1;

import "google/protobuf/struct.proto";
import "bronzeage/v1/common.proto";

option csharp_namespace = "BronzeAge.Contract.V1";

message OrdenAbandonarEpica {
  string asentamiento_id = 1;
  string aeda_id = 2;
}

message OrdenAbandonarRecinto {
  string asentamiento_id = 1;
  string recinto_id = 2;
}

message OrdenAbrirAlijo {
  string alijo_id = 1;
}

message OrdenAceptarTrueque {
  string acuerdo_id = 1;
}

message OrdenActivarPolitica {
  string asentamiento_id = 1;
  string cargo = 2;  // gobernador | tesorero | general | maestroObras | sacerdote
  string politica_id = 3;
}

message OrdenAdjuntarCaravana {
  string ejercito_id = 1;
  string caravana_id = 2;
  string heroe_id = 3;
}

message OrdenAdmitirOtrasFacciones {
  string faccion_id = 1;
  bool admitir = 2;
}

message OrdenAdoptarTecnologia {
  string faccion_id = 1;
  string tecnologia_id = 2;  // id de catálogo
}

message OrdenAgregarCarroCaravana {
  string caravana_id = 1;
  string tipo_carro = 2;  // basico | reforzado
}

message OrdenAlternarAutoConstruccion {
  string asentamiento_id = 1;
  bool pausada = 2;
}

message OrdenAlternarReabastecerAliados {
  string asentamiento_id = 1;
  bool permitido = 2;
}

message OrdenAlternarReceta {
  string asentamiento_id = 1;
  string recurso = 2;  // id de catálogo
  bool pausada = 3;
}

// El Gobernador o el Tesorero pausa (o reanuda) el consumo de un bien de consumo en la plaza (2026-11-10): pausado, la población no lo come (pierde su empuje al
// crecimiento) y la guarnición no come la carne; se acumula en el almacén para venderlo. Vale para carne, pan, queso, vino, cerveza, aceite (de oliva) y aceite de sésamo; el trigo nunca se pausa.
// Rechazos: `consumo.no_se_pausa`. Sin cambios: `SIN_CAMBIOS`.
message OrdenPausarConsumo {
  string asentamiento_id = 1;
  string recurso = 2;  // id de catálogo: carne | pan | queso | vino | cerveza | aceite | aceiteSesamo
  bool pausado = 3;
}

message OrdenAnadirEdificioManualmente {
  string asentamiento_id = 1;
  string cargo = 2;  // gobernador | maestroObras
  string tipo = 3;  // id de catálogo
}

message OrdenAportarARefundacion {
  string recurso = 1;  // id de catálogo
  sint64 cantidad = 2;
  string lado = 3;  // almacen | carro (dentro del campamento, el carro que lleva; con la columna a la puerta, el de ella, siendo su Líder)
}

message OrdenAsignarCargoLocal {
  string asentamiento_id = 1;
  string cargo = 2;  // gobernador | tesorero | general | maestroObras | sacerdote | maestroCaravanas
  string heroe_id = 3;
}

message OrdenAsignarEmbajador {
  string faccion_id = 1;
  string heroe_id = 2;
}

message OrdenAsignarEscolta {
  string caravana_id = 1;
  string heroe_id = 2;
  repeated string escuadron_ids = 3;
}

message OrdenAsignarGuarnicion {
  string squad_id = 1;
}

message OrdenAsignarRey {
  string faccion_id = 1;
  string heroe_id = 2;
}

message OrdenAtacar {
  message Objetivo {
    oneof tipo {
    string ejercito_id = 1;
    string caravana_id = 2;
    string campamento_id = 3;
    string asentamiento_id = 4;
    string pueblo_id = 5;
    string avanzada_id = 6;
    }
  }
  string heroe_id = 1;
  Objetivo objetivo = 2;
  optional bool declara_guerra = 3;
}

message OrdenBorrarLoadout {
  string loadout_id = 1;
}

message OrdenCalibrarReservaManual {
  string asentamiento_id = 1;
  string recurso = 2;  // id de catálogo
  sint64 valor = 3;
}

message OrdenCambiarResidencia {
  string destino_id = 1;
  string heroe_id = 2;
}

message OrdenCambiarSeleccionDeConvocatoria {
  string heroe_id = 1;
  repeated string escuadron_ids = 2;
  Cantidades carga = 3;
}

message OrdenCancelarBatalla {
  string battle_id = 1;
}

message OrdenCancelarCaravana {
  string caravana_id = 1;
}

message OrdenCancelarConvocatoria {
  string heroe_id = 1;
}

message OrdenCancelarFormacion {
  string heroe_id = 1;
}

message OrdenCancelarObra {
  string heroe_id = 1;
  string obra_id = 2;
}

message OrdenCargarCaravana {
  string ejercito_id = 1;
  string caravana_id = 2;
  string asentamiento_id = 3;
  string recurso = 4;  // id de catálogo
  sint64 cantidad = 5;
}

message OrdenCederLiderazgo {
  string ejercito_id = 1;
  string heroe_id = 2;
  string sucesor_id = 3;
}

message OrdenColocarAvanzada {
  string asentamiento_id = 1;
  string heroe_id = 2;
  Punto posicion = 3;
}

message OrdenColocarOrdenMercado {
  string asentamiento_id = 1;
  string tipo = 2;  // compra | venta
  string recurso = 3;  // id de catálogo
  sint64 cantidad = 4;
  optional sint64 precio = 5;
}

message OrdenComerciarEnPlaza {
  string heroe_id = 1;
  string asentamiento_id = 2;
  string orden_id = 3;
  sint64 cantidad = 4;
}

message OrdenComprarAnimalCaravana {
  string caravana_id = 1;
  sint64 carro_indice = 2;
  string tipo_animal = 3;  // buey | caballo | camello
}

message OrdenComprarCaravanaDeRefundacion {
}

message OrdenComprarEnCampamento {
  string recurso = 1;  // id de catálogo
  sint64 cantidad = 2;
  optional string campamento_id = 3;
  // almacenPersonal | carro (2026-11-02). Sin él, el residente paga con su almacén personal y el visitante con el carro que lleva. Con carro, también el residente
  // paga con el oro del carro (el de su columna, o dentro el que lleva) y la compra va a él; el trigo no va al carro.
  optional string pagar_con = 4;
}

message OrdenComprarInformePlaza {
  message Origen {
    string tipo = 1;  // asentamiento | campamento
    string id = 2;
  }
  Origen origen = 1;
  string asentamiento_id = 2;
}

// Compra en la taberna de la plaza `asentamiento_id` (de la Facción del héroe, que está dentro; Rey, Embajador o Gobernador) el informe de la región del relieve de esa plaza (tanda 69 §7):
// `plazas` (las plazas de la región, que quedan como fichas conocidas) u `ordenes` (las órdenes de mercado de esas plazas, que llegan en la `VISTA` `INTEL.region.caducidadMinutos` y se pueden tomar con
// `tomar_orden_a_distancia`). Entran todas las plazas de la región menos las de la Facción y las de una Facción en guerra con ella. Paga el almacén de la plaza un precio fijo
// (`INTEL.region.oro`); el mismo tipo de la misma región no se repite hasta `INTEL.region.cooldownMinutos` (`intel.informe_reciente`).
message OrdenComprarInformeRegion {
  string asentamiento_id = 1;
  string tipo = 2;  // plazas | ordenes
}

// Compra un rumor en la taberna de una plaza de la Facción del héroe (dentro; Rey, Embajador o Gobernador; paga el almacén de la plaza) o en la de un campamento de mercenarios
// (cualquier héroe con Facción; paga su almacén personal si reside allí o el carro de su columna) (2026-11-10). El único tipo por ahora, `vetas_estano`: el terreno alrededor de
// cada yacimiento de estaño de la región del relieve de la taberna queda explorado para la Facción (`INTEL.rumores.vetasEstano`: precio en oro y radio). Si la Facción ya
// tenía explorados todos esos sitios, se rechaza sin cobrar (`rumor.sin_novedad`).
message OrdenComprarRumor {
  message Origen {
    string tipo = 1;  // asentamiento | campamento
    string id = 2;
  }
  Origen origen = 1;
  string tipo = 2;  // vetas_estano
}

message OrdenComprarMirada {
  message Origen {
    string tipo = 1;  // asentamiento | campamento
    string id = 2;
  }
  Origen origen = 1;
  Punto centro = 2;
}

message OrdenComprarTecnologiaAeda {
  string asentamiento_id = 1;
  string tecnologia_id = 2;  // id de catálogo
}

message OrdenComprometerRecinto {
  string asentamiento_id = 1;
  string cargo = 2;  // gobernador | maestroObras
  string nivel = 3;  // 1 | 2 | 3
}

message OrdenConectarse {
  string heroe_id = 1;
}

message OrdenControlarReloj {
  string accion = 1;  // pausar | reanudar | fijar_factor | avanzar_hasta
  optional int64 factor_milesimas = 2;
  optional int64 hasta_ms = 3;
}

message OrdenConvocarEjercito {
  string heroe_id = 1;
  string politica_de_union = 2;  // aceptar | preguntar
  repeated string escuadron_ids = 3;
  Cantidades carga = 4;
}

message OrdenCrearCaravana {
  string asentamiento_id = 1;
}

message OrdenCrearFaccion {
  message Sigilo {
    string forma_id = 1;
    string campo_id = 2;
    string emblema_id = 3;
    string color_primario_id = 4;
    string color_secundario_id = 5;
    string color_emblema_id = 6;
    string orla_id = 7;
    string color_orla_id = 8;
  }
  string nombre = 1;
  optional Sigilo sigilo = 2;
}

message OrdenCrearHeroe {
  message Avatar {
    string cabeza_id = 1;
    string pelo_id = 2;
    string barba_id = 3;
    string cejas_id = 4;
  }
  // El nombre del héroe, recortado: de 1 a 24 caracteres sin caracteres de control (`heroe.nombre_invalido`). Vacío deja el héroe sin nombre y se muestra «Héroe N».
  string display_name = 1;
  string campamento_id = 2;
  string class_definition_id = 3;
  string genero = 4;  // masculino | femenino
  Avatar avatar = 5;
}

message OrdenDeclararGuerra {
  string faccion_a_id = 1;
  string faccion_b_id = 2;
}

message OrdenDejarDePerseguir {
  string heroe_id = 1;
}

message OrdenDejarFaccion {
}

message OrdenDejarResidencia {
  string heroe_id = 1;
}

message OrdenDesarmarCaravanaFundacion {
  string caravana_id = 1;
}

// La caída del cliente: sale del mundo a los 2:30 (PRESENCIA.retardoDesconexionMs), aplazada si le persiguen. La manda el servidor al cerrarse el
// socket del jugador; el cliente que cierra sesión a propósito manda `cerrar_sesion`.
message OrdenDesconectarse {
  string heroe_id = 1;
}

message OrdenDesignarCapital {
  string faccion_id = 1;
  string asentamiento_id = 2;
}

message OrdenDestruirAvanzada {
  string heroe_id = 1;
  string avanzada_id = 2;
}

message OrdenDestruirPueblo {
  string heroe_id = 1;
  string pueblo_id = 2;
}

message OrdenElegirTropaDeAvanzada {
  string heroe_id = 1;
  string avanzada_id = 2;
  string tropa_id = 3;
}

message OrdenEmpezarEpica {
  string asentamiento_id = 1;
  string aeda_id = 2;
  string tecnologia_id = 3;  // id de catálogo
}

message OrdenEntrarEnAsentamiento {
  string asentamiento_id = 1;
  string heroe_id = 2;
}

message OrdenEntrarEnCampamento {
  string campamento_id = 1;
  string heroe_id = 2;
}

message OrdenEntregarDeCaravana {
  string ejercito_id = 1;
  string caravana_id = 2;
  string acuerdo_id = 3;
}

message OrdenEntregarEnObra {
  string heroe_id = 1;
  string obra_id = 2;
  Cantidades materiales = 3;
}

message OrdenEnviarCaravanaAlOrigen {
  string heroe_id = 1;
  string caravana_id = 2;
  string asentamiento_id = 3;
}

message OrdenEstacionarEjercito {
  string ejercito_id = 1;
}

// Activa o quita la marcha forzada de una columna: se queda puesta hasta que se quita.
message OrdenMarchaForzada {
  string ejercito_id = 1;
  bool activa = 2;
}

// Reclama la recompensa de una misión cumplida (Misiones §4). `dueno_id`: `heroe-N`, `as-N` o `f-N`; el héroe es el de la cuenta.
message OrdenReclamarRecompensa {
  string dueno_id = 1;
  string mision_id = 2;
}

// Acepta una misión individual del tablón de una plaza o una Facción (Misiones_Recurrentes §3). `dueno_id`: `as-N` o `f-N`; el héroe es el de la cuenta.
message OrdenAceptarMision {
  string dueno_id = 1;
  string mision_id = 2;
}

// El Gobernador de la plaza o el Rey de la Facción elige lo que sale en su tablón desde la próxima renovación semanal: hasta 7 diarias y hasta 7 semanales
// (Misiones_Recurrentes §4). Sustituye la elección anterior entera.
message OrdenElegirTablon {
  string dueno_id = 1;
  repeated string diarias_ids = 2;
  repeated string semanales_ids = 3;
}

// Dentro de un pueblo o una aldea (Economia_Construccion §14.0.1). Las da el héroe de la cuenta, dentro del pueblo y ciudadano de la Facción de su plaza madre, con la
// columna con la que entró.
// Deja escuadrones de su columna en la guarnición del pueblo, dentro de su cupo (`Pueblo.cupo_guarnicion_por_heroe`).
message OrdenGuarnecerPueblo {
  string pueblo_id = 1;
  repeated string escuadron_ids = 2;
}

// Recoge escuadrones suyos de la guarnición del pueblo a su columna, sin pasar de su Liderazgo.
message OrdenRetirarDePueblo {
  string pueblo_id = 1;
  repeated string escuadron_ids = 2;
}

// Carga en el carro de su columna `cantidad` (milésimas) de un recurso del almacén local, hasta donde quepa.
message OrdenCargarDePueblo {
  string pueblo_id = 1;
  string recurso = 2;  // id de catálogo
  sint64 cantidad = 3;
}

// Deja en el almacén local `cantidad` (milésimas) de un recurso que el pueblo produce (la aldea, trigo y ganado), del carro de su columna, hasta donde quepa.
message OrdenDejarEnPueblo {
  string pueblo_id = 1;
  string recurso = 2;  // id de catálogo
  sint64 cantidad = 3;
}

// Dentro de la plaza y ciudadano de su Facción (resida o no): carga en su carro `cantidad` (milésimas, se usan unidades enteras) de un recurso del almacén, hasta donde quepa y sin bajar el trigo
// de su reserva. Si el Gobernador lo cerró (`Asentamiento.almacen_cerrado_a_ciudadanos`), solo él (2026-10-29).
message OrdenCargarDePlaza {
  string asentamiento_id = 1;
  string recurso = 2;  // id de catálogo
  sint64 cantidad = 3;
}

// Dentro de la plaza y de su Facción o de una aliada o vasalla: deja en el almacén `cantidad` (milésimas, se usan unidades enteras) de un recurso de su carro, hasta donde quepa (2026-10-29).
message OrdenDejarEnPlaza {
  string asentamiento_id = 1;
  string recurso = 2;  // id de catálogo
  sint64 cantidad = 3;
}

// El Gobernador cierra (o abre) a los ciudadanos el sacar del almacén de la plaza al carro (`cargar_de_plaza`) (2026-10-29).
message OrdenCerrarAlmacenACiudadanos {
  string asentamiento_id = 1;
  bool cerrado = 2;
}

// El Gobernador o un General cierra (o abre) a los ciudadanos que no residen en la plaza el reclutar escuadras nuevas en ella (`reclutar_tropa`; 2026-11-10). Cerrado
// (`Asentamiento.reclutamiento_cerrado_a_ciudadanos`), solo reponen las que ya tienen allí. Sin cambios: `SIN_CAMBIOS`.
message OrdenCerrarReclutamientoACiudadanos {
  string asentamiento_id = 1;
  bool cerrado = 2;
}

message OrdenFijarPuerta {
  string asentamiento_id = 1;
  string heroe_id = 2;
  repeated string cerrada_a = 3;
}

message OrdenFundar {
}

message OrdenGuardarEnAlmacenPersonal {
  string recurso = 1;  // id de catálogo
  sint64 cantidad = 2;
}

message OrdenGuardarLoadout {
  optional string loadout_id = 1;
  string display_name = 2;
  repeated string squad_ids = 3;
  reserved 4;          // antes `perks_seleccionados`: desde el 2026-11-12 los perks se abren solos con el nivel (D15)
  optional bool activo = 5;
}

message OrdenGuarnecer {
  string asentamiento_id = 1;
  string heroe_id = 2;
}

message OrdenGuarnecerAvanzada {
  string heroe_id = 1;
  string avanzada_id = 2;
  repeated string escuadron_ids = 3;
}

message OrdenInspeccionar {
  message Objetivo {
    oneof tipo {
    string ejercito_id = 1;
    string caravana_id = 2;
    string asentamiento_id = 3;
    }
  }
  string heroe_id = 1;
  Objetivo objetivo = 2;
}

message OrdenLanzarCaravanaFundacion {
  string origen_asentamiento_id = 1;
}

message OrdenMarcarPueblo {
  string asentamiento_id = 1;
  string heroe_id = 2;
  string nodo_id = 3;
}

message OrdenMarcharA {
  message Objetivo {
    oneof tipo {
    string asentamiento_id = 1;
    Punto punto = 2;
    }
  }
  string heroe_id = 1;
  Objetivo objetivo = 2;
}

message OrdenMejorarAvanzada {
  string heroe_id = 1;
  string avanzada_id = 2;
}

message OrdenMejorarEdificioAhora {
  string asentamiento_id = 1;
  string cargo = 2;  // gobernador | maestroObras
  string edificio_id = 3;
}

message OrdenMejorarRecinto {
  string asentamiento_id = 1;
  string cargo = 2;  // gobernador | maestroObras
  string recinto_id = 3;
}

message OrdenMoverCargaCaravanaAparcada {
  string heroe_id = 1;
  string caravana_id = 2;
  string asentamiento_id = 3;
  string recurso = 4;  // id de catálogo
  sint64 cantidad = 5;
  string sentido = 6;  // cargar | descargar
}

message OrdenMoverCarroCaravana {
  string desde_caravana_id = 1;
  string hacia_caravana_id = 2;
  sint64 carro_indice = 3;
}

message OrdenMoverEnCola {
  string asentamiento_id = 1;
  string cargo = 2;  // gobernador | maestroObras
  string edificio_id = 3;
  string direccion = 4;  // arriba | abajo
}

message OrdenMovilizarEjercito {
  message Objetivo {
    oneof tipo {
    string asentamiento_id = 1;
    Punto punto = 2;
    }
  }
  string asentamiento_id = 1;
  string heroe_id = 2;
  repeated string escuadron_ids = 3;
  optional Objetivo objetivo = 4;
  optional string politica_de_union = 5;  // rechazar | aceptar | preguntar
  optional Cantidades carga = 6;
  // Una Caravana de Fundación (`car-N`) de su Facción que espera dentro de la plaza: el ejército se la lleva al salir y el héroe pasa a ser su titular.
  optional string caravana_fundacion_id = 7;
}

message OrdenOrdenarEscuadras {
  repeated string escuadron_ids = 1;
}

// 2026-11-11 (Heroe_Y_Tropa §10.4): la familia de formación de una escuadra propia, por su id de `FORMACIONES`.
message OrdenElegirFormacion {
  string escuadron_id = 1;
  string formacion = 2;
}

// 2026-11-12 (Heroe_Y_Tropa §4.5, Clases_De_Heroe §4): el héroe de la cuenta se pone la pieza de una casilla de su mochila (`ItemInstancia.casilla_inventario`); lo que
// estaba en el hueco, y con un arma la armadura que su clase no admite, va a la mochila. Dentro de una plaza, un pueblo o un campamento (D2).
message OrdenEquiparObjeto {
  uint32 casilla = 1;
}

// 2026-11-12: el héroe de la cuenta se quita lo de un hueco (casco | torso | guantes | pantalones | botas | montura; el arma no se quita) y va a su mochila.
message OrdenDesequiparObjeto {
  string hueco = 1;
}

// 2026-11-12 (D22): `cantidad` de la casilla `casilla` de la mochila del héroe de la cuenta a su almacén de objetos, dentro de su residencia.
message OrdenGuardarObjeto {
  uint32 casilla = 1;
  uint32 cantidad = 2;
}

// 2026-11-12 (D22): `cantidad` de la casilla `casilla` de su almacén de objetos a su mochila, dentro de su residencia.
message OrdenSacarObjeto {
  uint32 casilla = 1;
  uint32 cantidad = 2;
}

// 2026-11-12 (D1, Catalogo_De_Objetos §6): el héroe de la cuenta compra, con sus monedas, una pieza del catálogo `OBJETOS` (su id) en la Armería de la plaza donde está
// dentro; llega a su mochila al 100 %. Solo armas, armaduras y monturas hasta `tiendaHastaTier`, con el metal abierto por la tecnología de la Facción de la plaza.
message OrdenComprarObjeto {
  string objeto = 1;
}

// 2026-11-12 (D1 y D18): el héroe de la cuenta vende `cantidad` de la casilla `casilla` de su mochila a la Armería de la plaza donde está dentro, a `ventaPct` de la ficha.
message OrdenVenderObjeto {
  uint32 casilla = 1;
  uint32 cantidad = 2;
}

// 2026-11-12 (D1, Catalogo_De_Objetos §6b): el héroe de la cuenta forja una pieza (id de `OBJETOS`, tiers II a V) en la Armería de la plaza donde reside, estando dentro: el
// plano y los crisoles salen de su mochila y los materiales de su almacén personal. La pieza nace con calidad del 90 al 110 % y su `item_instance_id` (`obj-N`).
message OrdenForjarObjeto {
  string objeto = 1;
}

// 2026-11-12 (D2, Catalogo_De_Objetos §3.3): el héroe de la cuenta usa el consumible de la casilla `casilla` de su mochila (una medalla o el cofre de monturas), dentro de
// una plaza, un pueblo o un campamento. `escuadron_id`: la escuadra suya que recibe una medalla de tropa; las demás no lo miran.
message OrdenUsarObjeto {
  uint32 casilla = 1;
  optional string escuadron_id = 2;
}

message OrdenOrganizarEjercito {
  string heroe_id = 1;
  string politica_de_union = 2;  // aceptar | preguntar
}

message OrdenPartirConvocatoria {
  string heroe_id = 1;
  // Una Caravana de Fundación (`car-N`) de la Facción que espera dentro del lugar: el ejército se la lleva al partir y su Líder pasa a ser su titular.
  optional string caravana_fundacion_id = 2;
}

message OrdenPasarAViveres {
  sint64 cantidad = 1;
}

message OrdenPedirPrestamo {
  repeated string tropa_ids = 1;
}

message OrdenPerseguir {
  message Objetivo {
    oneof tipo {
    string ejercito_id = 1;
    string caravana_id = 2;
    }
  }
