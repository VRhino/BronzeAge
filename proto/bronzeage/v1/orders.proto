  Objetivo objetivo = 2;
}

message OrdenPrepararCaravana {
  string caravana_id = 1;
  string heroe_id = 2;
  string destino_asentamiento_id = 3;
  Cantidades carga = 4;
  repeated string escolta_escuadron_ids = 5;
  optional sint64 salir_en = 6;
}

// El Maestro de Caravanas, el Tesorero o el Gobernador del origen de la caravana, residente y dentro, le da un encargo de transporte (2026-10-31): una ruta
// permanente (`ruta`) entre dos plazas de su Facción, o un envío programado (`envio`) de una ida y vuelta a cualquier plaza. La caravana tiene que estar
// `disponible` y con algún carro con animal; los carros y la escolta son los que ya tenga.
message OrdenEncargarCaravana {
  string caravana_id = 1;
  string destino_asentamiento_id = 2;
  string modo = 3;  // ruta | envio
  optional sint64 salir_en_ms = 4;  // solo el envío: hora de mundo, hasta `maxProgramacionDias` vista; sin ella sale ya
  ParadaEncargo parada_origen = 5;
  ParadaEncargo parada_destino = 6;
}

// Desde el Mercado de la plaza `asentamiento_id`, toma `cantidad` de la orden de mercado `orden_id` de otra plaza (tanda 69 §7). Los mismos cargos que `encargar_caravana`. Hace falta un informe
// de órdenes vigente de la región de la plaza de la orden (`intel.sin_informe_de_ordenes`). Lanza un envío en la primera caravana libre de la plaza (por id) cuya capacidad llega a `cantidad`
// (`caravana.no_disponible`) con una línea con el precio de la orden como tope: si la otra plaza vende, compra allí; si compra, lleva de la plaza lo que le vende. La mercancía viaja y el oro no.
message OrdenTomarOrdenADistancia {
  string asentamiento_id = 1;
  string orden_id = 2;
  sint64 cantidad = 3;
}

// Cambia el encargo de una caravana (los mismos que pueden darlo). Vale para todo paso que aún no ha empezado; el destino solo cambia con la caravana
// esperando en su origen. El modo no cambia.
message OrdenCambiarEncargo {
  string caravana_id = 1;
  string destino_asentamiento_id = 2;
  optional sint64 salir_en_ms = 3;
  ParadaEncargo parada_origen = 4;
  ParadaEncargo parada_destino = 5;
}

// Cancela el encargo de una caravana (los mismos que pueden darlo). Esperando en su origen, queda `disponible` allí y lo que llevara vuelve al almacén; si no,
// acaba el tramo en curso sin comerciar, vuelve y deja todo en el origen.
message OrdenCancelarEncargo {
  string caravana_id = 1;
}

// Detiene la ruta de una caravana (2026-11-04; los mismos que pueden darla): si va de camino o está en el destino, acaba esa ida y vuelta comerciando como siempre y, al descargar en su origen,
// se queda `disponible` sin encargo (`Encargo.detener`). Esperando en su origen, termina ya, como al cancelar. Un envío ya acaba solo al volver: `sin cambios`.
message OrdenDetenerEncargo {
  string caravana_id = 1;
}

// ── Mercenarios por contrato (entrada 48, Mercenarios_Por_Contrato; 2026-11-01). Quien da la orden es siempre el héroe de la cuenta. ──

// Un héroe bot, sin Facción, residente y dentro de su campamento, se pone en el tablón del campamento como mercenario (§3). Un humano recibe `mercenario.solo_bots`.
message OrdenOfrecerseComoMercenario {}

// Quita su oferta del tablón. Cambiar de residencia también la quita.
message OrdenRetirarOferta {}

// El Rey, el Embajador o un cargo local (el de más rango que tenga y que alcance: no se elige), en el campamento del mercenario, dentro o con su columna a `radioPuerta`, y con el
// oro de la tarifa, lo contrata (§3 a §5). `trabajo`: defender | escoltar | atacar | acompanar | permanente. Temporal con `plazo_dias` (1 | 3 | 7); permanente sin plazo y con
// `residencia_asentamiento_id`, una plaza de la Facción donde pasa a residir.
message OrdenContratarMercenario {
  string mercenario_id = 1;
  string trabajo = 2;
  ObjetivoMercenario objetivo = 3;
  optional uint32 plazo_dias = 4;
  optional string residencia_asentamiento_id = 5;
  // almacenPersonal | carro (2026-11-03). Con almacenPersonal, su almacén personal, solo en el campamento donde reside (`almacen_personal.fuera_de_tu_residencia`); con carro, el
  // carro que lleva dentro (también el suyo, en el campamento donde reside) o el de su columna a la puerta. Sin él, el carro de la columna que lleva y, dentro del campamento donde
  // reside sin columna, el almacén personal. `monedas` (tanda 69): las monedas del héroe, a la tarifa en monedas del tablón, en cualquier sitio; van a las monedas del mercenario
  // (`heroe.sin_monedas` si no bastan). `almacenPlaza` (tanda 69 §8): desde dentro de una plaza de su Facción con Taberna activa, sin ir al campamento, que ha de caer en la región de la plaza
  // (`mercenario.fuera_de_la_region`); paga el almacén de la plaza, que firma el Rey, el Embajador o el Gobernador, y es lo que se toma allí sin `pagar_con`. Con `almacenPersonal` o `carro`
  // fuera del campamento, `campamento.fuera_de_la_puerta`.
  optional string pagar_con = 6;
}

// Quien podría firmarlo hoy alarga el contrato temporal `plazo_dias` (1 | 3 | 7) pagando la tarifa de ese plazo, en persona: en el campamento del mercenario o con su columna a
// `radioPuerta` de la de él (§6.2).
message OrdenProrrogarContrato {
  string mercenario_id = 1;
  uint32 plazo_dias = 2;
  // Como en `OrdenContratarMercenario` (2026-11-03), en el campamento base; con la columna junto a la del mercenario, solo el carro de la columna. `monedas` vale en los dos sitios.
  optional string pagar_con = 3;
}

// Da la misma orden a entre 1 y 16 mercenarios con contrato con su Facción (§6.1). `tipo`: guardar | ir_a | atacar | unirse. Si uno no la admite, no entra ninguna y el rechazo
// lo nombra.
message OrdenOrdenarMercenario {
  repeated string mercenario_ids = 1;
  string tipo = 2;
  ObjetivoMercenario objetivo = 3;
}

// El Rey o el Embajador cambian a un permanente a otra plaza de la Facción, sin cooldown (§6.2).
message OrdenMudarMercenario {
  string mercenario_id = 1;
  string asentamiento_id = 2;
}

// Quien podría firmar el contrato lo acaba antes de tiempo (§6.2 y §7). Si combate, el fin espera a que acabe su batalla.
message OrdenDespedirMercenario {
  string mercenario_id = 1;
}

// Quien firmó un contrato ya acabado, o el Rey, lo valora mientras dura el plazo de valoración (§8.2).
message OrdenValorarMercenario {
  string mercenario_id = 1;
  bool buena = 2;
}

